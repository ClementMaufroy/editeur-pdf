async function bookmarkStarts(doc) {
  const ol = await doc.pdf.getOutline();
  if (!ol || !ol.length) return [];
  const res = [];
  for (const it of ol) {
    try {
      let dest = it.dest;
      if (typeof dest === 'string') dest = await doc.pdf.getDestination(dest);
      if (!dest) continue;
      const ref = dest[0];
      const idx = typeof ref === 'object' ? await doc.pdf.getPageIndex(ref) : ref;
      res.push({ title: it.title, index: idx });
    } catch { }
  }
  res.sort((a, b) => a.index - b.index);
  return res.filter((r, k) => k === 0 || r.index !== res[k - 1].index);
}

function openSplitDialog() {
  const doc = S.active; if (!doc) return;
  const n = doc.sizes.length;
  const base = stripExt(doc.name);
  const d = dialog({
    title: 'Scinder le document', icon: 'Split', width: 560,
    body: `<p class="hint" style="margin-top:0">« ${esc(doc.name)} » — ${n} pages. Les fichiers produits sont enregistrés dans le dossier de votre choix.</p>
      <label class="check"><input type="radio" name="sm" value="every" checked> Toutes les <input type="number" id="sN" value="1" min="1" max="${n}" style="width:60px;height:26px;margin:0 4px"> page(s)</label>
      <label class="check"><input type="radio" name="sm" value="ranges"> Selon des plages : <input type="text" id="sR" placeholder="1-3; 4-10; 11-" style="flex:1;height:26px;margin-left:4px;border:1px solid var(--line);border-radius:5px;padding:0 6px"></label>
      <label class="check"><input type="radio" name="sm" value="bm"> Selon les signets de premier niveau <span class="hint" id="sBmInfo"></span></label>
      <div class="field" style="margin-top:12px"><label>Nom des fichiers</label><input type="text" id="sName" value="${esc(base)}_{n}"><span class="hint">{n} = numéro, {titre} = titre du signet, {pages} = pages contenues</span></div>`,
    buttons: [{ spacer: true }, { label: 'Annuler', value: null }, { label: 'Scinder…', icon: 'Split', primary: true, onClick: api => go(api) }],
  });
  const el = d.el;
  let bms = [];
  bookmarkStarts(doc).then(b => { bms = b; el.querySelector('#sBmInfo').textContent = b.length ? `(${b.length} signets)` : '(aucun signet)'; });
  el.querySelector('#sR').addEventListener('focus', () => el.querySelector('input[value=ranges]').checked = true);
  async function go(api) {
    const mode = el.querySelector('input[name=sm]:checked').value;
    let groups = [];
    if (mode === 'every') { const k = Math.max(1, +el.querySelector('#sN').value || 1); for (let s = 0; s < n; s += k) groups.push({ idx: [...Array(Math.min(k, n - s)).keys()].map(j => s + j) }); }
    else if (mode === 'ranges') {
      for (const part of el.querySelector('#sR').value.split(';').map(s => s.trim()).filter(Boolean)) { const idx = parseRanges(part, n); if (!idx || !idx.length) { toast('Plage invalide : ' + part, 'err'); return; } groups.push({ idx }); }
      if (!groups.length) { toast('Indiquez au moins une plage.', 'err'); return; }
    } else {
      if (!bms.length) { toast('Ce document ne contient pas de signets.', 'err'); return; }
      if (bms[0].index > 0) groups.push({ idx: [...Array(bms[0].index).keys()], title: 'Début' });
      bms.forEach((b, k) => { const end = k < bms.length - 1 ? bms[k + 1].index : n; groups.push({ idx: [...Array(end - b.index).keys()].map(j => b.index + j), title: b.title }); });
    }
    const pattern = el.querySelector('#sName').value || base + '_{n}';
    let dir = null;
    try { if ('showDirectoryPicker' in window) dir = await showDirectoryPicker({ id: 'prele-split', mode: 'readwrite', startIn: doc.handle || 'documents' }); }
    catch (e) { handleErr(e); return; }
    api.close('ok');
    busy(true);
    try {
      const src = await PDFDocument.load(await buildOutputBytes(doc), { updateMetadata: false });
      const pad = String(groups.length).length;
      let k = 0;
      for (const g of groups) {
        k++;
        const out = await PDFDocument.create();
        (await out.copyPages(src, g.idx)).forEach(p => out.addPage(p));
        const pages = g.idx.length > 1 ? `${g.idx[0] + 1}-${g.idx[g.idx.length - 1] + 1}` : `${g.idx[0] + 1}`;
        let name = safeFileName(pattern.replace('{n}', String(k).padStart(pad, '0')).replace('{titre}', g.title || String(k)).replace('{pages}', pages)) + '.pdf';
        const bytes = await out.save();
        if (dir) {
          let finalName = name, c = 2;
          while (true) { try { await dir.getFileHandle(finalName); finalName = name.replace(/\.pdf$/, ` (${c++}).pdf`); } catch { break; } }
          await writeHandle(await dir.getFileHandle(finalName, { create: true }), bytes);
        } else downloadBytes(name, bytes);
      }
      toast(`${groups.length} fichier${groups.length > 1 ? 's' : ''} créé${groups.length > 1 ? 's' : ''}${dir ? ' dans « ' + dir.name + ' »' : ''}.`);
      if (dir && S.folder.root && (await S.folder.stack[S.folder.stack.length - 1].isSameEntry(dir))) loadFolder();
    } catch (e) { handleErr(e, 'Scinder'); }
    finally { busy(false); }
  }
}

    else return;

  dialog({
    title: 'Insérer des pages', icon: 'FilePlus2', width: 460,
    body: `<p style="margin-top:0">${srcs.map(s => '« ' + esc(s.name) + ' »').join(', ')}</p>
      <label class="check"><input type="radio" name="ip" value="before"> Avant la première page</label>

function cmdExtract() {
  const doc = S.active; if (!doc) return;
  const t = targetPages(doc);
  const def = doc.selected.size ? compactRanges(t) : `${doc.current + 1}`;
  dialog({
    title: 'Extraire des pages', icon: 'FileOutput', width: 460,
    body: `<div class="field"><label>Pages à extraire (${doc.sizes.length} pages au total)</label><input type="text" id="xRange" value="${def}"></div>
      <label class="check"><input type="checkbox" id="xDel"> Supprimer ces pages du document d'origine</label>
      <label class="check"><input type="checkbox" id="xSave"> Enregistrer directement dans un fichier</label>`,
    buttons: [{ spacer: true }, { label: 'Annuler', value: null }, { label: 'Extraire', icon: 'FileOutput', primary: true, onClick: async api => {
      const idx = parseRanges(api.el.querySelector('#xRange').value, doc.sizes.length);
      if (!idx || !idx.length) { toast('Plage de pages invalide.', 'err'); return; }
      const del = api.el.querySelector('#xDel').checked, save = api.el.querySelector('#xSave').checked;
      api.close('ok');
      busy(true);
      try {
        const src = await PDFDocument.load(await buildOutputBytes(doc), { updateMetadata: false });
        const out = await PDFDocument.create();
        (await out.copyPages(src, idx)).forEach(p => out.addPage(p));
        const bytes = await out.save();
        const name = `${stripExt(doc.name)} (pages ${compactRanges(idx)}).pdf`;
        let h = null;
        if (save) h = await saveNewFile(safeFileName(name.replace(/\.pdf$/, '')) + '.pdf', bytes);
        await openBytes(h ? h.name : name, bytes, h, { dirty: !h });
        if (del) {
          if (idx.length >= doc.sizes.length) toast('Toutes les pages ont été extraites : le document d\'origine est conservé.', 'err');
          else await mutate(doc, (pdf, pages) => { [...new Set(idx)].sort((a, b) => b - a).forEach(i => { pdf.removePage(i); pages.splice(i, 1); }); return pages; });
        }
      } catch (e) { handleErr(e, 'Extraction'); }
      finally { busy(false); }
    } }],
  });
}
function compactRanges(idx) {
  const s = [...new Set(idx)].sort((a, b) => a - b); const out = [];
  for (let k = 0; k < s.length; k++) { let j = k; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(j > k ? `${s[k] + 1}-${s[j] + 1}` : `${s[k] + 1}`); k = j; }
  return out.join(',');
}

let searchTimer = null;
async function runSearch(q, jump = true) {
  const doc = S.active;
  S.search.q = q; S.search.results = []; S.search.idx = -1;
  if (!doc || !q.trim()) { updateSearchCount(); if (doc) doc.sizes.forEach((_, i) => renderSearchHL(doc, i)); return; }
  const nq = normTxt(q);
  const res = [];
  for (let i = 0; i < doc.sizes.length; i++) {
    const tc = await getText(doc, i);
    if (S.search.q !== q || S.active !== doc) return;
    tc.raw.items.forEach((it, k) => {
      if (!it.str) return;
      const s = normTxt(it.str);
      let p = s.indexOf(nq);
      while (p >= 0) { res.push({ page: i, item: k, start: p, len: nq.length, strLen: s.length }); p = s.indexOf(nq, p + Math.max(1, nq.length)); }
    });
  }
  S.search.results = res;
  if (res.length) {
    const fromPage = doc.current;
    S.search.idx = Math.max(0, res.findIndex(r => r.page >= fromPage));
  }
  updateSearchCount();
  doc.sizes.forEach((_, i) => renderSearchHL(doc, i));
  if (jump && res.length) gotoSearch(S.search.idx);
}
function updateSearchCount() {
  const r = S.search;
  $('#searchCount').textContent = r.q ? (r.results.length ? `${r.idx + 1}/${r.results.length}` : 'aucun') : '';
}
function searchRect(doc, r) {
  const it = doc.text[r.page].raw.items[r.item];
  const t = it.transform;
  const size = Math.hypot(t[2], t[3]);
  if (Math.abs(t[1]) > 1e-3 || Math.abs(t[2]) > 1e-3) return { x: t[4], y: t[5] - size * 0.2, w: it.width, h: size * 1.1 };
  const fx = r.start / Math.max(1, r.strLen), fw = r.len / Math.max(1, r.strLen);
  return { x: t[4] + it.width * fx, y: t[5] - size * 0.22, w: Math.max(2, it.width * fw), h: size * 1.12 };
}
function renderSearchHL(doc, i) {
  const el = pageEl(i); if (!el) return;
  const layer = el.querySelector('.hl'); layer.innerHTML = '';
  const vp = doc.vps[i]; if (!vp || !S.search.results.length) return;
  S.search.results.forEach((r, k) => {
    if (r.page !== i) return;
    const b = searchRect(doc, r), rr = rectToVp(vp, b.x, b.y, b.w, b.h);
    const d = document.createElement('div');
    if (k === S.search.idx) d.className = 'cur';
    Object.assign(d.style, { left: rr.left + 'px', top: rr.top + 'px', width: rr.width + 'px', height: rr.height + 'px' });
    layer.appendChild(d);
  });
}
function gotoSearch(k) {
  const doc = S.active; const R = S.search.results; if (!doc || !R.length) return;
  S.search.idx = (k + R.length) % R.length;
  const r = R[S.search.idx];
  updateSearchCount();
  doc.sizes.forEach((_, i) => { if (doc.vps[i]) renderSearchHL(doc, i); });
  const el = pageEl(r.page); if (!el) return;
  const b = searchRect(doc, r);
  const vp = doc.vps[r.page] || doc.pageObjs[r.page].getViewport({ scale: doc.scale });
  const rr = rectToVp(vp, b.x, b.y, b.w, b.h);
  const v = viewer();
  v.scrollTo({ top: el.offsetTop + rr.top - v.clientHeight / 3, left: Math.max(0, el.offsetLeft + rr.left - v.clientWidth / 2), behavior: 'auto' });
}

/* --- notification avec bouton d'action --- */
function toastAction(msg, label, fn, ms = 9000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span><button class="toast-act">${esc(label)}</button>`;
  el.querySelector('button').onclick = () => { el.remove(); fn(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* --- fichiers transmis par Windows ---------------------------------
   • plusieurs fichiers dans un même lancement (menu « Envoyer vers →
     Combiner dans … ») → fenêtre « Combiner » pré-remplie ;
   • fichiers ouverts un par un (double-clic, Entrée sur une sélection)
     → onglets, puis proposition de les combiner s'ils arrivent ensemble. */
const launchBatch = { docs: [], timer: null };
async function handleLaunch(files) {
  if (!files || !files.length) return;
  const pdfs = files.filter(h => h.kind !== 'directory');
  if (pdfs.length >= 2) {
    openCombineDialog(pdfs.map(h => ({ name: h.name, src: { type: 'handle', handle: h } })), { openSeparately: true });
    return;
  }
  const before = new Set(S.docs);
  await openHandles(files);
  S.docs.filter(d => !before.has(d) && !launchBatch.docs.includes(d)).forEach(d => launchBatch.docs.push(d));
  clearTimeout(launchBatch.timer);
  launchBatch.timer = setTimeout(() => {
    const docs = launchBatch.docs.filter(d => S.docs.includes(d));
    launchBatch.docs = [];
    if (docs.length >= 2) toastAction(`${docs.length} documents ouverts depuis l'Explorateur.`, 'Les combiner…',
      () => openCombineDialog(docs.map(d => ({ name: d.name, sub: 'document ouvert', src: { type: 'doc', doc: d } }))));
  }, 2500);
}

/* --- copie / déplacement de pages entre documents --- */
async function copyPagesBetween(src, idx, dst, at, move = false) {
  if (!idx.length) return;
  busy(true);
  let srcPdf;
  try { srcPdf = await PDFDocument.load(await buildOutputBytes(src), { updateMetadata: false }); }
  catch (e) { busy(false); handleErr(e, 'Lecture du document source'); return; }
  busy(false);
  const n = idx.length;
  const ok = await mutate(dst, async (pdf, pages) => {
    const cp = await pdf.copyPages(srcPdf, idx);
    cp.forEach((p, k) => pdf.insertPage(at + k, p));
    pages.splice(at, 0, ...cp.map(() => ({ uid: uid(), edits: [] })));
    return pages;
  }, { current: at, select: idx.map((_, k) => at + k) });
  if (!ok) return;
  let moved = false;
  if (move) {
    if (idx.length >= src.sizes.length) toast('Toutes les pages ont été copiées : le document d\'origine est conservé tel quel.', 'err', 6000);
    else {
      moved = await mutate(src, (pdf, pages) => { [...idx].sort((a, b) => b - a).forEach(i => { pdf.removePage(i); pages.splice(i, 1); }); return pages; });
      if (S.active === dst) renderDocTabs();
    }
  }
  toast(`${n} page${n > 1 ? 's' : ''} ${moved ? 'déplacée' : 'copiée'}${n > 1 ? 's' : ''} dans « ${dst.name} » (position ${at + 1}).`);
}

/* --- insertion de fichiers (PDF / images) à une position --- */
async function insertSourcesAt(doc, sources, at) {
  if (!sources.length) return;
  try {
    const bytes = await combineEngine(sources.map(s => ({ name: s.name, range: '', getBytes: () => srcBytes(s.src) })), {});
    const add = await PDFDocument.load(bytes);
    const cnt = add.getPageCount();
    await mutate(doc, async (pdf, pages) => {
      const cp = await pdf.copyPages(add, [...Array(cnt).keys()]);
      cp.forEach((p, k) => pdf.insertPage(at + k, p));
      pages.splice(at, 0, ...cp.map(() => ({ uid: uid(), edits: [] })));
      return pages;
    }, { current: at, select: [...Array(cnt).keys()].map(k => at + k) });
    toast(`${cnt} page${cnt > 1 ? 's' : ''} insérée${cnt > 1 ? 's' : ''} à la position ${at + 1}.`);
  } catch (e) { handleErr(e, 'Insertion'); }
}

/* --- glisser-déposer des miniatures (souris) ---
   • dans le même document : réordonner ;
   • sur l'onglet d'un autre document : s'y arrêter ~0,7 s l'ouvre, on choisit
     alors l'emplacement dans ses miniatures ou sur une page ; lâcher directement
     sur l'onglet ajoute les pages à la fin ;
   • copie par défaut, Maj enfoncée au moment de lâcher = déplacement. */
const PD = { on: false };
function clearDropMarks() {
  $$('.thumb.drop-before, .thumb.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  $$('.doctab.drop-tab').forEach(x => x.classList.remove('drop-tab'));
  $$('.page.drop-page').forEach(x => x.classList.remove('drop-page'));
}
function dropTargetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const tab = el.closest('.doctab');
  if (tab) { const doc = S.docs.find(d => d.id === tab.dataset.doc); return doc ? { kind: 'tab', doc, el: tab } : null; }
  const d = S.active; if (!d) return null;
  const thumb = el.closest('.thumb');
  if (thumb) { const r = thumb.getBoundingClientRect(); const before = y < r.top + r.height / 2; return { kind: 'pos', doc: d, at: +thumb.dataset.index + (before ? 0 : 1), el: thumb, mark: before ? 'drop-before' : 'drop-after' }; }
  if (el.closest('[data-sideview="pages"]')) {
    const all = $$('.thumb', $('#thumbs'));
    const last = all[all.length - 1];
    if (last) { const first = all[0]; if (y < first.getBoundingClientRect().top) return { kind: 'pos', doc: d, at: 0, el: first, mark: 'drop-before' }; return { kind: 'pos', doc: d, at: d.sizes.length, el: last, mark: 'drop-after' }; }
  }
  const pg = el.closest('.page');
  if (pg) return { kind: 'pos', doc: d, at: +pg.dataset.index + 1, el: pg, mark: 'drop-page' };
  return null;
}
function showDropTarget(T) {
  clearDropMarks();
  if (!T) return;
  if (T.kind === 'tab') T.el.classList.add('drop-tab');
  else T.el.classList.add(T.mark);
}
function autoScrollLoop() {
  if (!PD.on) return;
  const box = $('.sidebody'), r = box.getBoundingClientRect();
  if (PD.x >= r.left && PD.x <= r.right) {
    if (PD.y < r.top + 36) box.scrollTop -= 10;
    else if (PD.y > r.bottom - 36) box.scrollTop += 10;
  }
  const v = viewer(), rv = v.getBoundingClientRect();
  if (PD.x >= rv.left && PD.x <= rv.right) {
    if (PD.y < rv.top + 30 && PD.y > rv.top - 4) v.scrollTop -= 14;
    else if (PD.y > rv.bottom - 30) v.scrollTop += 14;
  }
  requestAnimationFrame(autoScrollLoop);
}
function initPageDrag(th) {
  th.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    const t = ev.target.closest('.thumb'); const d = S.active; if (!t || !d) return;
    ev.preventDefault();
    const i = +t.dataset.index, sx = ev.clientX, sy = ev.clientY;
    let started = false;
    const mm = m => {
      if (!started) {
        if (Math.hypot(m.clientX - sx, m.clientY - sy) < 6) return;
        started = true; beginPageDrag(d, i, t);
      }
      PD.x = m.clientX; PD.y = m.clientY;
      PD.ghost.style.left = (m.clientX + 14) + 'px'; PD.ghost.style.top = (m.clientY + 10) + 'px';
      PD.ghost.classList.toggle('move', m.shiftKey);
      const T = dropTargetAt(m.clientX, m.clientY);
      PD.target = T;
      showDropTarget(T);
      // s'attarder sur l'onglet d'un autre document l'ouvre
      if (T && T.kind === 'tab' && T.doc !== S.active) {
        if (PD.dwellDoc !== T.doc) {
          clearTimeout(PD.dwellTimer); PD.dwellDoc = T.doc;
          PD.dwellTimer = setTimeout(() => { if (PD.on && PD.dwellDoc === T.doc) { activate(T.doc); PD.dwellDoc = null; } }, 700);
        }
      } else { clearTimeout(PD.dwellTimer); PD.dwellDoc = null; }
    };
    const end = async (m, cancel) => {
      window.removeEventListener('mousemove', mm, true); window.removeEventListener('mouseup', mu, true); window.removeEventListener('keydown', kd, true);
      if (!started) return;
      S.suppressClick = true; setTimeout(() => { S.suppressClick = false; }, 0);
      const src = PD.src, pages = PD.pages, T = cancel ? null : PD.target, move = !!(m && m.shiftKey);
      endPageDrag();
      if (!T) return;
      if (T.doc === src) {
        if (T.kind === 'tab') return;
        const n = src.sizes.length, to = T.at;
        const rest = [...Array(n).keys()].filter(k => !pages.includes(k));
        const before = rest.filter(k => k < to).length;
        const order = [...rest.slice(0, before), ...pages, ...rest.slice(before)];

/* =====================================================================
   v1.4 — Déverrouillage automatique des PDF protégés
   ---------------------------------------------------------------------
   Beaucoup de PDF (banques, impôts, notaires…) s'ouvrent sans mot de
   passe mais sont chiffrés avec des restrictions (modification, copie…).
   On retire ce chiffrement avec qpdf (WebAssembly, chargé à la demande),
   entièrement sur l'ordinateur, pour rendre le document modifiable.
   ===================================================================== */
const QPDF_BASE = 'libs/qpdf/';
let qpdfLoad = null;
function loadQpdf() {
  if (qpdfLoad) return qpdfLoad;
  qpdfLoad = (async () => {
    const prev = window.Module;
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = QPDF_BASE + 'qpdf.js';
      s.onload = res; s.onerror = () => rej(new Error('module de déverrouillage introuvable (connexion internet ?)'));
      document.head.appendChild(s);
    });
    const factory = window.Module;
    if (prev === undefined) delete window.Module; else window.Module = prev;
    const resp = await fetch(QPDF_BASE + 'qpdf.wasm');
    if (!resp.ok) throw new Error('module de déverrouillage introuvable');
    const wasmBinary = new Uint8Array(await resp.arrayBuffer());
    return { factory, wasmBinary };
  })();
  qpdfLoad.catch(() => { qpdfLoad = null; });
  return qpdfLoad;
}

/* repère rapidement un dictionnaire /Encrypt (début et fin du fichier) */
function looksEncrypted(bytes) {
  const span = 96 * 1024;
  const dec = new TextDecoder('latin1');
  const tail = dec.decode(bytes.subarray(Math.max(0, bytes.length - span)));
  if (/\/Encrypt\s/.test(tail) || /\/Encrypt\s*\d/.test(tail)) return true;
  const head = dec.decode(bytes.subarray(0, Math.min(bytes.length, span)));
  return /\/Encrypt\s*\d+\s+\d+\s+R/.test(head);
}

async function qpdfDecrypt(bytes, password = '') {
  const { factory, wasmBinary } = await loadQpdf();
  const errs = [];
  const m = await factory({ wasmBinary, noInitialRun: true, print: () => { }, printErr: t => errs.push(t) });
  m.FS.writeFile('/in.pdf', bytes);
  const args = ['--decrypt'];
  if (password) args.push('--password=' + password);
  args.push('/in.pdf', '/out.pdf');
  try { m.callMain(args); } catch (e) { /* code de sortie non nul : on vérifie le résultat ci-dessous */ }
  let out = null;
  try { out = m.FS.readFile('/out.pdf'); } catch { }
  if (!out || out.length < 64) throw new Error(errs.filter(Boolean).slice(-1)[0] || 'déverrouillage impossible');
  return out;
}

/* appelé à l'ouverture : renvoie les octets déverrouillés, ou null si le document n'est pas protégé */
async function unlockIfNeeded(bytes, password) {
  if (!looksEncrypted(bytes)) return null;
  try { await PDFDocument.load(bytes, { updateMetadata: false }); return null; }   // pas réellement chiffré
  catch (e) { if (!/encrypt/i.test(String(e && e.message))) return null; }
  return await qpdfDecrypt(bytes, password || '');
}

/* charge un PDF dans pdf-lib en le déverrouillant si nécessaire (combiner, insérer…) */
async function loadPdfLibUnlocked(bytes, name) {
  try { return await PDFDocument.load(bytes, { updateMetadata: false }); }
  catch (e) {
    if (!/encrypt/i.test(String(e && e.message))) throw e;
    try { return await PDFDocument.load(await qpdfDecrypt(bytes), { updateMetadata: false }); }
    catch (e2) { throw new Error(`« ${name} » est protégé et n'a pas pu être déverrouillé (${e2.message})`); }
  }
}

    return;
  }
  if (S.tool === 'cover') {
    const P = pagePoint(ev); if (!P || ev.target.closest('.ebox')) return;
    ev.preventDefault();
    const rb = document.createElement('div'); rb.className = 'rubber'; P.pel.appendChild(rb);
    const r0 = P.pel.getBoundingClientRect();
    let x1 = P.x, y1 = P.y;
    const draw = () => Object.assign(rb.style, { left: Math.min(P.x, x1) + 'px', top: Math.min(P.y, y1) + 'px', width: Math.abs(x1 - P.x) + 'px', height: Math.abs(y1 - P.y) + 'px' });
    const mm = m => { x1 = Math.max(0, Math.min(r0.width, m.clientX - r0.left)); y1 = Math.max(0, Math.min(r0.height, m.clientY - r0.top)); draw(); };
    const mu = () => {
      window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); rb.remove();
      if (Math.abs(x1 - P.x) < 4 || Math.abs(y1 - P.y) < 4) return;
      const a = P.vp.convertToPdfPoint(P.x, P.y), b = P.vp.convertToPdfPoint(x1, y1);
      const e = { id: uid(), type: 'cover', cover: { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(a[0] - b[0]), h: Math.abs(a[1] - b[1]) }, bg: [...S.fmt.bg] };
      pushUndo(d);
      d.pages[P.i].edits.push(e);
      S.activeEdit = e;
      renderEdits(d, P.i); refreshThumbBadge(d, P.i); updateUI();
    };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  }
}
function onViewerClick(ev) {
  const d = S.active; if (!d) return;
  if (S.tool !== 'addtext') S.justCommitted = false;
  if (S.tool === 'edittext') {
    const hit = ev.target.closest('.hit');
    if (hit) { const P = pagePoint(ev); if (P) startReplaceEdit(d, P.i, +hit.dataset.line); return; }
    if (!ev.target.closest('.ebox') && !S.editing && S.activeEdit) { S.activeEdit = null; d.sizes.forEach((_, i) => d.vps[i] && renderEdits(d, i)); updateUI(); }
  } else if (S.tool === 'addtext') {
    if (ev.target.closest('.ebox') || ev.target.closest('.etext.editing')) return;
    if (S.editing) return;
    if (S.justCommitted) { S.justCommitted = false; return; } // le premier clic valide la saisie en cours
    const P = pagePoint(ev); if (!P) return;
    startAddText(d, P.i, P.pdf);
  } else if (S.tool === 'cover') {
    if (!ev.target.closest('.ebox') && S.activeEdit) { S.activeEdit = null; d.sizes.forEach((_, i) => d.vps[i] && renderEdits(d, i)); updateUI(); }
  }
}

/* --- menu contextuel --- */
function openCtxMenu(x, y, items) {
  closeCtxMenu();
  const m = document.createElement('div');
  m.className = 'ctxmenu'; m.id = 'ctxmenu';
  m.innerHTML = items.map(it => it === '-' ? '<hr>' : `<button data-cmd="${it[2]}">${svgIcon(it[0], 15)}${esc(it[1])}</button>`).join('');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
}
function closeCtxMenu() { const m = $('#ctxmenu'); if (m) m.remove(); }

/* =====================================================================
   Démarrage
   ===================================================================== */
function init() {
  $('#logo').innerHTML = LOGO_SVG;
  hydrateIcons();
  bindEvents();
  updateUI();
  buildViewer();
  buildThumbs();
  if (!hasFS) toast('Pour enregistrer directement dans vos dossiers, utilisez Google Chrome ou Microsoft Edge.', 'err', 8000);
  // fichiers transmis par Windows (double-clic sur un PDF, « Ouvrir avec ») quand l'application est installée
  if ('launchQueue' in window) launchQueue.setConsumer(p => handleLaunch(p.files || []));
  // application installable (PWA) : service worker + bouton « Installer »
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (secure && 'serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
  }
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); S.installPrompt = ev; showInstall(true); });
  window.addEventListener('appinstalled', () => { S.installPrompt = null; showInstall(false); });
}
window.PRELE = { S, handleLaunch, copyPagesBetween, openBytes, buildOutputBytes, combineEngine, mutate, reorderPages, startReplaceEdit, finishEditor, getText, runCmd, setTool, applyFmt };
init();

</script>
