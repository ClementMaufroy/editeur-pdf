<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur PDF</title>
<meta name="theme-color" content="#24503f">
<meta name="description" content="Éditeur PDF personnel : afficher, organiser, combiner et modifier des PDF.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!-- Bibliothèques : pdf.js (Mozilla, Apache 2.0), pdf-lib (MIT). Icônes : Lucide (ISC). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --brand:#24503f; --brand-2:#2f6a54; --brand-3:#3f8569; --brand-ink:#eaf4ef;
  --accent:#c99a2e; --accent-soft:#f6ecd2;
  --bg:#e7ebe8; --panel:#ffffff; --panel-2:#f6f8f7; --line:#d5ddd8; --line-2:#e6ebe8;
  --text:#1b2420; --muted:#5f6d66; --sel:#dbece4; --sel-line:#7fb59d; --hover:#eef4f1;
  --danger:#b4392f; --focus:#2f6a54;
  --shadow:0 1px 2px rgba(20,40,30,.12),0 4px 14px rgba(20,40,30,.10);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 var(--font);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
svg{flex:none}
#app{display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;height:100vh}

/* ---------- barre de titre ---------- */
.titlebar{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;background:var(--brand);color:var(--brand-ink)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px;font-size:14px}
.brand small{font-weight:500;opacity:.65;font-size:11px;margin-left:2px}
.qa{display:flex;gap:2px;margin-left:8px;padding-left:10px;border-left:1px solid rgba(255,255,255,.18)}
.qa button{background:none;border:0;color:inherit;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;cursor:pointer;opacity:.9}
.qa button:hover:not(:disabled){background:rgba(255,255,255,.14)}
.qa button:disabled{opacity:.35;cursor:default}
.title-doc{flex:1;text-align:center;font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbox{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border-radius:7px;padding:0 4px 0 8px;height:28px;width:300px}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff}
.searchbox input::placeholder{color:rgba(255,255,255,.6)}
.searchbox .count{font-size:11px;opacity:.75;white-space:nowrap}
.searchbox button{background:none;border:0;color:#fff;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;cursor:pointer}
.searchbox button:hover{background:rgba(255,255,255,.16)}
.installbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.35);border-radius:7px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:12px}
.installbtn:hover{background:rgba(255,255,255,.2)}
.installbtn[hidden],.bs-nav button[hidden]{display:none}
.helpbtn{background:none;border:0;color:inherit;width:30px;height:28px;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.helpbtn:hover{background:rgba(255,255,255,.14)}

/* ---------- ruban ---------- */
.tabstrip{display:flex;gap:2px;padding:0 8px;background:var(--brand);height:30px;align-items:flex-end}
.tabstrip button{border:0;background:none;color:var(--brand-ink);padding:6px 14px 6px;border-radius:6px 6px 0 0;cursor:pointer;font-size:12.5px;opacity:.88}
.tabstrip button:hover{background:rgba(255,255,255,.1);opacity:1}
.tabstrip button.active{background:var(--panel);color:var(--brand);font-weight:600;opacity:1}
.tabstrip button.file{background:var(--brand-3);color:#fff;font-weight:600;margin-right:6px;opacity:1}
.tabstrip button.file:hover{background:#4a9878}
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);height:96px;overflow-x:auto;overflow-y:hidden}
.rpanel{display:none;height:100%;padding:4px 6px 0}
.rpanel.active{display:flex}
.rgroup{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line-2);height:calc(100% - 4px)}
.rgroup:last-child{border-right:0}
.rgroup .rbody{flex:1;display:flex;align-items:flex-start;gap:2px}
.rgroup .rlabel{font-size:11px;color:var(--muted);text-align:center;padding:1px 0 3px;white-space:nowrap}
.rbig{display:flex;flex-direction:column;align-items:center;gap:3px;width:auto;min-width:54px;max-width:78px;padding:5px 5px 4px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;font-size:11.5px;line-height:1.15;text-align:center;color:var(--text)}
.rbig svg{color:var(--brand-2)}
.rbig:hover:not(:disabled){background:var(--hover);border-color:var(--line-2)}
.rbig.on{background:var(--sel);border-color:var(--sel-line)}
.rbig:disabled,.rsmall:disabled{opacity:.4;cursor:default}
.rcol{display:flex;flex-direction:column;gap:1px;padding-top:2px}
.rsmall{display:flex;align-items:center;gap:6px;height:24px;padding:0 7px 0 5px;border:1px solid transparent;border-radius:5px;background:none;cursor:pointer;font-size:12px;white-space:nowrap;color:var(--text)}
.rsmall svg{color:var(--brand-2)}
.rsmall:hover:not(:disabled){background:var(--hover);border-color:var(--line-2)}
.rsmall.on{background:var(--sel);border-color:var(--sel-line)}
.rrow{display:flex;align-items:center;gap:4px;height:26px}
.rrow select,.rrow input[type=number]{height:24px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 4px}
.rrow input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:5px;padding:1px;background:#fff}
.ticon{width:26px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
.ticon.on{background:var(--sel);border-color:var(--sel-line)}
.ticon:disabled{opacity:.4}
.zoomsel{height:24px;border:1px solid var(--line);border-radius:5px;background:#fff;width:118px}

/* ---------- onglets documents ---------- */
.doctabs{display:flex;align-items:flex-end;gap:2px;height:32px;padding:0 6px;background:var(--panel-2);border-bottom:1px solid var(--line);overflow-x:auto}
.doctab{display:flex;align-items:center;gap:6px;height:27px;max-width:240px;padding:0 6px 0 10px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:#eef2ef;cursor:pointer;font-size:12px;color:var(--muted)}
.doctab.active{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 -2px 0 var(--brand-3) inset}
.doctab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doctab .dirty{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.doctab .x{width:18px;height:18px;border-radius:4px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.doctab .x:hover{background:#dfe6e2;color:var(--text)}
.doctabs .newtab{border:0;background:none;width:26px;height:26px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;margin-bottom:1px}
.doctabs .newtab:hover{background:var(--hover)}

/* ---------- espace de travail ---------- */
.workspace{display:flex;min-height:0}
.sidepane{width:212px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.sidepane.hidden{display:none}
.sidetabs{display:flex;border-bottom:1px solid var(--line)}
.sidetabs button{flex:1;border:0;background:none;padding:8px 4px;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px}
.sidetabs button.active{color:var(--brand);font-weight:600;border-bottom-color:var(--brand-3)}
.sidebody{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.sideview{display:none}
.sideview.active{display:block}
.thumbs{padding:10px 0 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.thumb{position:relative;padding:5px 5px 2px;border-radius:6px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none}
.thumb:hover{background:var(--hover)}
.thumb.sel{background:var(--sel);border-color:var(--sel-line)}
.thumb.cur .tn{color:var(--brand);font-weight:700}
.thumb canvas,.thumb .tph{display:block;background:#fff;box-shadow:0 0 0 1px #cfd7d2,0 1px 3px rgba(0,0,0,.12)}
.thumb .tn{font-size:11px;color:var(--muted)}
.thumb .tedit{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.thumb.drop-before::before,.thumb.drop-after::after{content:"";position:absolute;left:4px;right:4px;height:3px;background:var(--accent);border-radius:2px}
.thumb.drop-before::before{top:-5px}
.thumb.drop-after::after{bottom:-5px}
.sideempty{padding:24px 14px;color:var(--muted);font-size:12px;text-align:center}

.folderbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line-2)}
.folderbar .btn{height:26px;padding:0 8px;font-size:12px}
.crumbs{padding:6px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.crumbs a{color:var(--brand-2);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.flist{padding:0 4px 20px}
.frow{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:default;user-select:none}
.frow:hover{background:var(--hover)}
.frow.sel{background:var(--sel)}
.frow input{margin:0}
.frow .fth{width:30px;height:38px;flex:none;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #d4dcd7;border-radius:2px;overflow:hidden;color:var(--brand-2)}
.frow .fth canvas{max-width:30px;max-height:38px}
.frow .fmeta{min-width:0;flex:1}
.frow .fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.frow .fsub{font-size:10.5px;color:var(--muted)}
.frow.dir .fth{background:none;box-shadow:none}
.factions{position:sticky;bottom:0;display:flex;gap:4px;padding:8px;background:var(--panel);border-top:1px solid var(--line-2)}
.factions .btn{padding:0 8px;justify-content:center}
.factions .btn.primary{flex:1}

.viewer{flex:1;overflow:auto;position:relative;min-width:0}
.viewer.hand{cursor:grab}
.viewer.hand.dragging{cursor:grabbing}
.pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 20px 40px;min-width:max-content}
.page{position:relative;background:#fff;box-shadow:var(--shadow)}
.page canvas.pc{position:absolute;inset:0;width:100%;height:100%}
.page .pnum{position:absolute;bottom:-16px;right:0;font-size:10.5px;color:var(--muted)}
.layer{position:absolute;inset:0}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:.25;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:#2a7cd6}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}
.viewer:not(.t-select) .textLayer{pointer-events:none}
.hl{z-index:3;pointer-events:none}
.hl div{position:absolute;background:rgba(255,196,0,.38);border-radius:2px}
.hl div.cur{background:rgba(255,120,0,.55);outline:2px solid rgba(220,90,0,.8)}
.hits{z-index:4;display:none}
.viewer.t-edittext .hits{display:block}
.hit{position:absolute;border:1px dashed transparent;border-radius:2px;cursor:text}
.hit:hover{border-color:#3d8c6d;background:rgba(61,140,109,.08)}
.edits{z-index:5;pointer-events:none}
.ecover{position:absolute;pointer-events:none}
.etext{position:absolute;white-space:pre;line-height:1.2;transform-origin:0 0;pointer-events:none;outline:none;min-width:4px}
.ebox{position:absolute;pointer-events:none;border:1px dashed transparent;border-radius:2px}
.viewer.t-edittext .ebox,.viewer.t-addtext .ebox,.viewer.t-cover .ebox{pointer-events:auto;cursor:text}
.viewer.t-edittext .ebox:hover,.viewer.t-addtext .ebox:hover,.viewer.t-cover .ebox:hover{border-color:var(--accent);background:rgba(201,154,46,.06)}
.ebox.editing-box{pointer-events:none!important}
.ebox.active{border:1.5px solid var(--accent)!important;background:rgba(201,154,46,.05)}
.etext.editing{pointer-events:auto;cursor:text;outline:none;caret-color:#c2410c}
.ebadge{position:absolute;display:none;gap:2px;pointer-events:auto;z-index:6}
.viewer.t-edittext .ebox:hover .ebadge,.viewer.t-addtext .ebox:hover .ebadge,.viewer.t-cover .ebox:hover .ebadge,.ebox.active .ebadge{display:flex}
.ebadge button{width:18px;height:18px;border-radius:4px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ebadge button.mv{cursor:move;background:var(--brand-2)}
.rubber{position:absolute;border:1.5px dashed var(--brand-2);background:rgba(255,255,255,.6);z-index:7;pointer-events:none}
.viewer.t-addtext .page,.viewer.t-cover .page{cursor:crosshair}

/* ---------- accueil ---------- */
.welcome{min-height:100%;display:grid;place-items:center;padding:30px}
.wcard{width:min(760px,100%);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:28px 30px;display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.wcard h1{margin:0 0 4px;font-size:22px;color:var(--brand);display:flex;align-items:center;gap:10px}
.wcard p.lead{margin:0 0 18px;color:var(--muted)}
.wact{display:flex;flex-direction:column;gap:8px}
.wbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:left}
.wbtn:hover{border-color:var(--sel-line);background:var(--hover)}
.wbtn svg{color:var(--brand-2)}
.wbtn b{display:block;font-weight:600}
.wbtn span{font-size:12px;color:var(--muted)}
.dropzone{margin-top:12px;border:1.5px dashed var(--line);border-radius:9px;padding:14px;text-align:center;color:var(--muted);font-size:12px}
.wrecent h3{margin:2px 0 8px;font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.rlist{display:flex;flex-direction:column;gap:2px}
.ritem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer}
.ritem:hover{background:var(--hover)}
.ritem svg{color:var(--brand-2)}
.ritem .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rd{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.dragover-all::after{content:"Déposez vos fichiers pour les ouvrir";position:fixed;inset:8px;border:3px dashed var(--brand-3);border-radius:14px;background:rgba(36,80,63,.08);display:grid;place-items:center;font-size:20px;color:var(--brand);font-weight:600;z-index:999;pointer-events:none}

/* ---------- barre d'état ---------- */
.statusbar{display:flex;align-items:center;gap:14px;height:26px;padding:0 10px;background:var(--panel-2);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.statusbar .pg{display:flex;align-items:center;gap:4px}
.statusbar .pg input{width:44px;height:20px;border:1px solid var(--line);border-radius:4px;text-align:center;font-size:11.5px}
.statusbar .sp{flex:1}
.statusbar .warn{color:#8a5a00}
.spinner{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--brand-3);border-radius:50%;animation:spin .8s linear infinite;display:none}
body.busy .spinner{display:inline-block}
body.busy,body.busy *{cursor:progress!important}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- fenêtres ---------- */
dialog{border:0;border-radius:12px;box-shadow:0 10px 40px rgba(10,30,20,.3);padding:0;color:var(--text);max-width:calc(100vw - 40px)}
dialog::backdrop{background:rgba(15,30,24,.35)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 60px)}
.dlg header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2);font-weight:650;font-size:14px;color:var(--brand)}
.dlg header .x{margin-left:auto;border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.dlg header .x:hover{background:var(--hover)}
.dlg .body{padding:14px 16px;overflow:auto}
.dlg footer{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line-2);background:var(--panel-2);border-radius:0 0 12px 12px}
.dlg footer .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--sel-line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand)}
.btn svg{color:currentColor}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.lbl{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff}
.field textarea{height:auto;padding:6px 8px;resize:vertical}
.check{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:12.5px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}
.cmb-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cmb-table{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmb-head,.cmb-row{display:grid;grid-template-columns:28px 1fr 64px 120px 92px;align-items:center;gap:6px;padding:5px 8px}
.cmb-head{background:var(--panel-2);font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.cmb-list{max-height:300px;min-height:150px;overflow:auto}
.cmb-row{border-bottom:1px solid var(--line-2);font-size:12px;background:#fff}
.cmb-row.sel{background:var(--sel)}
.cmb-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmb-row .nm small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmb-row input[type=text]{width:100%;height:24px;border:1px solid var(--line);border-radius:5px;padding:0 6px}
.cmb-row .acts{display:flex;gap:2px;justify-content:flex-end}
.cmb-row .acts button{width:24px;height:24px;border:0;background:none;border-radius:5px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.cmb-row .acts button:hover{background:var(--hover);color:var(--text)}
.cmb-row .grip{cursor:grab;color:#9aa8a1;display:grid;place-items:center}
.cmb-empty{padding:40px 10px;text-align:center;color:var(--muted)}
.cmb-row.drop-before{box-shadow:0 -3px 0 var(--accent) inset}
.cmb-opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:12px}
.progress{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;flex:1;max-width:220px;display:none}
.progress>div{height:100%;width:0;background:var(--brand-3);transition:width .15s}
.kbd{font:11px ui-monospace,Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.notes h4{margin:12px 0 4px;color:var(--brand)}
.notes ul{margin:4px 0;padding-left:18px}
.notes li{margin:2px 0}

/* ---------- menu contextuel, notifications ---------- */
.ctxmenu{position:fixed;z-index:1000;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 10px;border-radius:5px;cursor:pointer;text-align:left;font-size:12.5px}
.ctxmenu button:hover{background:var(--hover)}
.ctxmenu button svg{color:var(--brand-2)}
.ctxmenu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.toasts{position:fixed;right:16px;bottom:38px;display:flex;flex-direction:column;gap:8px;z-index:1001}
.toast{background:#1e3a30;color:#eaf4ef;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:420px;font-size:12.5px;animation:tin .18s ease-out}
.toast.err{background:#7a2620}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ---------- coulisses (Fichier) ---------- */
.backstage{position:fixed;inset:68px 0 0 0;background:var(--panel);z-index:50;display:none;grid-template-columns:230px 1fr}
.backstage.open{display:grid}
.bs-nav{background:var(--brand);color:var(--brand-ink);padding:10px 0;display:flex;flex-direction:column}
.bs-nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;text-align:left;padding:9px 18px;cursor:pointer;font-size:13px}
.bs-nav button:hover{background:rgba(255,255,255,.1)}
.bs-nav button:disabled{opacity:.4;cursor:default;background:none}
.bs-nav hr{border:0;border-top:1px solid rgba(255,255,255,.15);margin:8px 14px}
.bs-nav .back{font-weight:600}
.bs-main{padding:28px 36px;overflow:auto}
.bs-main h2{margin:0 0 14px;font-size:20px;color:var(--brand);font-weight:600}

/* ---------- v1.3 : glisser des pages entre documents ---------- */
body.pdragging, body.pdragging *{cursor:grabbing!important;user-select:none}
.pdrag-ghost{position:fixed;z-index:2000;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;background:#fff;border:1px solid var(--sel-line);border-radius:8px;box-shadow:var(--shadow);opacity:.95}
.pdrag-ghost canvas{display:block;box-shadow:0 0 0 1px #cfd7d2}
.pdrag-n{font-size:11.5px;font-weight:600;color:var(--brand)}
.pdrag-hint{font-size:10px;color:var(--muted)}
.pdrag-ghost.move .pdrag-hint{color:#a35c00;font-weight:600}
.pdrag-ghost.move .pdrag-hint::before{content:"Déplacement · "}
.doctab.drop-tab{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.page.drop-page{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.toast{display:flex;align-items:center;gap:12px}
.toast-act{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.toast-act:hover{background:rgba(255,255,255,.25)}
body.dragover-thumbs::after{display:none}

</style>
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="brand"><span id="logo"></span>Éditeur PDF <small>v1.4.1</small></div>
    <div class="qa">
      <button data-cmd="open" title="Ouvrir (Ctrl+O)" data-icon="FolderOpen" data-icon-size="17"></button>
      <button data-cmd="save" title="Enregistrer (Ctrl+S)" data-icon="Save" data-icon-size="17"></button>
      <button data-cmd="undo" title="Annuler (Ctrl+Z)" data-icon="Undo2" data-icon-size="17"></button>
      <button data-cmd="redo" title="Rétablir (Ctrl+Y)" data-icon="Redo2" data-icon-size="17"></button>
    </div>
    <div class="title-doc" id="titleDoc"></div>
    <div class="searchbox" title="Rechercher dans le document (Ctrl+F)">
      <span data-icon="Search" data-icon-size="15"></span>
      <input id="searchInput" type="text" placeholder="Rechercher dans le document…" autocomplete="off">
      <span class="count" id="searchCount"></span>
      <button data-cmd="searchPrev" title="Précédent (Maj+Entrée)" data-icon="ChevronUp" data-icon-size="15"></button>
      <button data-cmd="searchNext" title="Suivant (Entrée)" data-icon="ChevronDown" data-icon-size="15"></button>
    </div>
    <button class="installbtn" data-cmd="install" id="installBtn" hidden title="Installer comme un logiciel sur cet ordinateur"><span data-icon="MonitorDown" data-icon-size="15"></span>Installer</button>
    <button class="helpbtn" data-cmd="help" title="Aide et notes de version" data-icon="CircleHelp" data-icon-size="18"></button>
  </header>

  <nav class="tabstrip" id="tabstrip">
    <button class="file" data-rtab="file">Fichier</button>
    <button data-rtab="home" class="active">Accueil</button>
    <button data-rtab="organize">Organiser</button>
    <button data-rtab="edit">Édition</button>
    <button data-rtab="view">Affichage</button>
  </nav>

  <section class="ribbon">
    <!-- ACCUEIL -->
    <div class="rpanel active" data-rpanel="home">
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="open" data-icon="FolderOpen" data-icon-size="26">Ouvrir</button>
        <button class="rbig" data-cmd="save" data-icon="Save" data-icon-size="26">Enregistrer</button>
        <div class="rcol">
          <button class="rsmall" data-cmd="saveAs" data-icon="FileDown" data-icon-size="16">Enregistrer sous</button>
          <button class="rsmall" data-cmd="openFolder" data-icon="Folder" data-icon-size="16">Ouvrir un dossier</button>
          <button class="rsmall" data-cmd="newDoc" data-icon="FilePlus2" data-icon-size="16">Nouveau document</button>
        </div>
      </div><div class="rlabel">Fichier</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig tool" data-tool="hand" data-icon="Hand" data-icon-size="26">Main</button>
        <button class="rbig tool" data-tool="select" data-icon="TextCursor" data-icon-size="26">Sélection<br>de texte</button>
        <button class="rbig tool" data-tool="edittext" data-icon="FilePenLine" data-icon-size="26">Modifier<br>le texte</button>
        <button class="rbig tool" data-tool="addtext" data-icon="Type" data-icon-size="26">Ajouter<br>du texte</button>
      </div><div class="rlabel">Outils</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="combine" data-icon="Merge" data-icon-size="26">Combiner<br>des fichiers</button>
        <button class="rbig" data-cmd="split" data-icon="Split" data-icon-size="26">Scinder</button>
        <div class="rcol">
          <button class="rsmall" data-cmd="insertFile" data-icon="FilePlus2" data-icon-size="16">Insérer des pages</button>
          <button class="rsmall" data-cmd="extract" data-icon="FileOutput" data-icon-size="16">Extraire des pages</button>
          <button class="rsmall" data-cmd="deletePages" data-icon="Trash2" data-icon-size="16">Supprimer des pages</button>
        </div>
      </div><div class="rlabel">Document</div></div>
      <div class="rgroup"><div class="rbody">
        <div class="rcol">
          <div class="rrow">
            <button class="ticon" data-cmd="zoomOut" title="Zoom arrière" data-icon="ZoomOut" data-icon-size="15"></button>
            <select class="zoomsel" data-zoomsel></select>
            <button class="ticon" data-cmd="zoomIn" title="Zoom avant" data-icon="ZoomIn" data-icon-size="15"></button>
          </div>
          <button class="rsmall" data-cmd="fitWidth" data-icon="ArrowLeftRight" data-icon-size="16">Pleine largeur</button>
          <button class="rsmall" data-cmd="fitPage" data-icon="Expand" data-icon-size="16">Page entière</button>
        </div>
      </div><div class="rlabel">Zoom</div></div>
    </div>

    <!-- ORGANISER -->
    <div class="rpanel" data-rpanel="organize">
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="rotateLeft" data-icon="RotateCcw" data-icon-size="26">Pivoter<br>à gauche</button>
        <button class="rbig" data-cmd="rotateRight" data-icon="RotateCw" data-icon-size="26">Pivoter<br>à droite</button>
        <button class="rbig" data-cmd="deletePages" data-icon="Trash2" data-icon-size="26">Supprimer</button>
        <div class="rcol">
          <button class="rsmall" data-cmd="duplicatePages" data-icon="Copy" data-icon-size="16">Dupliquer</button>
          <button class="rsmall" data-cmd="reversePages" data-icon="ArrowDownUp" data-icon-size="16">Inverser l'ordre</button>
          <button class="rsmall" data-cmd="deleteBlank" data-icon="FileX" data-icon-size="16">Supprimer les pages vides</button>
        </div>
      </div><div class="rlabel">Pages</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="insertFile" data-icon="FilePlus2" data-icon-size="26">Depuis un<br>fichier</button>
        <button class="rbig" data-cmd="insertBlank" data-icon="File" data-icon-size="26">Page<br>vierge</button>
      </div><div class="rlabel">Insérer</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="extract" data-icon="FileOutput" data-icon-size="26">Extraire</button>
        <button class="rbig" data-cmd="split" data-icon="Split" data-icon-size="26">Scinder</button>
        <button class="rbig" data-cmd="combine" data-icon="Merge" data-icon-size="26">Combiner</button>
      </div><div class="rlabel">Fractionner et regrouper</div></div>
      <div class="rgroup"><div class="rbody">
        <div class="rcol">
          <button class="rsmall" data-cmd="selectAllPages" data-icon="Check" data-icon-size="16">Sélectionner toutes les pages</button>
          <button class="rsmall" data-cmd="selectNone" data-icon="Square" data-icon-size="16">Désélectionner</button>
          <span class="hint" id="selInfo" style="padding:4px 6px"></span>
        </div>
      </div><div class="rlabel">Sélection</div></div>
    </div>

    <!-- ÉDITION -->
    <div class="rpanel" data-rpanel="edit">
      <div class="rgroup"><div class="rbody">
        <button class="rbig tool" data-tool="edittext" data-icon="FilePenLine" data-icon-size="26">Modifier<br>le texte</button>
        <button class="rbig tool" data-tool="addtext" data-icon="Type" data-icon-size="26">Ajouter<br>du texte</button>
        <button class="rbig tool" data-tool="cover" data-icon="Eraser" data-icon-size="26">Masquer<br>une zone</button>
      </div><div class="rlabel">Outils d'édition</div></div>
      <div class="rgroup"><div class="rbody">
        <div class="rcol">
          <div class="rrow">
            <select id="fFamily" title="Police">
              <option value="Helvetica">Helvetica / Arial</option>
              <option value="Times">Times</option>
              <option value="Courier">Courier</option>
            </select>
            <input id="fSize" type="number" min="4" max="200" step="0.5" value="11" style="width:58px" title="Taille (pt)">
          </div>
          <div class="rrow">
            <button class="ticon" id="fBold" title="Gras" data-icon="Bold" data-icon-size="15"></button>
            <button class="ticon" id="fItalic" title="Italique" data-icon="Italic" data-icon-size="15"></button>
            <input id="fColor" type="color" value="#000000" title="Couleur du texte">
            <button class="ticon" id="fAlignL" title="Ancrer à gauche (le texte s'allonge vers la droite)" data-icon="AlignLeft" data-icon-size="15"></button>
            <button class="ticon" id="fAlignR" title="Ancrer à droite (pour les montants alignés à droite)" data-icon="AlignRight" data-icon-size="15"></button>
            <span class="lbl" style="margin-left:6px">Fond</span>
            <input id="fBg" type="color" value="#ffffff" title="Couleur du masque">
          </div>
          <span class="hint" id="fHint" style="padding-left:2px">Aucune zone de texte active</span>
        </div>
      </div><div class="rlabel">Format</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="undo" data-icon="Undo2" data-icon-size="26">Annuler</button>
        <button class="rbig" data-cmd="redo" data-icon="Redo2" data-icon-size="26">Rétablir</button>
        <div class="rcol">
          <button class="rsmall" data-cmd="deleteEdit" data-icon="Trash2" data-icon-size="16">Supprimer la modification</button>
          <button class="rsmall" data-cmd="clearPageEdits" data-icon="Eraser" data-icon-size="16">Effacer les modifs de la page</button>
        </div>
      </div><div class="rlabel">Historique</div></div>
    </div>

    <!-- AFFICHAGE -->
    <div class="rpanel" data-rpanel="view">
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="zoomIn" data-icon="ZoomIn" data-icon-size="26">Zoom<br>avant</button>
        <button class="rbig" data-cmd="zoomOut" data-icon="ZoomOut" data-icon-size="26">Zoom<br>arrière</button>
        <div class="rcol">
          <div class="rrow"><select class="zoomsel" data-zoomsel></select></div>
          <button class="rsmall" data-cmd="fitWidth" data-icon="ArrowLeftRight" data-icon-size="16">Pleine largeur</button>
          <button class="rsmall" data-cmd="fitPage" data-icon="Expand" data-icon-size="16">Page entière</button>
        </div>
      </div><div class="rlabel">Zoom</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="togglePane" data-icon="PanelLeft" data-icon-size="26">Volet<br>latéral</button>
        <div class="rcol">
          <button class="rsmall" data-cmd="showPages" data-icon="Files" data-icon-size="16">Miniatures des pages</button>
          <button class="rsmall" data-cmd="showFolder" data-icon="Folder" data-icon-size="16">Explorateur de dossier</button>
        </div>
      </div><div class="rlabel">Volets</div></div>
      <div class="rgroup"><div class="rbody">
        <button class="rbig" data-cmd="docProps" data-icon="Info" data-icon-size="26">Propriétés</button>
      </div><div class="rlabel">Document</div></div>
    </div>
  </section>

  <div class="doctabs" id="doctabs"></div>

  <div class="workspace">
    <aside class="sidepane" id="sidepane">
      <div class="sidetabs">
        <button data-side="pages" class="active"><span data-icon="Files" data-icon-size="14"></span>Pages</button>
        <button data-side="folder"><span data-icon="Folder" data-icon-size="14"></span>Dossier</button>
      </div>
      <div class="sidebody">
        <div class="sideview active" data-sideview="pages"><div class="thumbs" id="thumbs"></div></div>
        <div class="sideview" data-sideview="folder" id="folderView"></div>
      </div>
    </aside>
    <main class="viewer t-select" id="viewer" tabindex="-1"></main>
  </div>

  <footer class="statusbar">
    <span class="spinner"></span>
    <span class="pg">Page <input id="pgInput" type="text"> / <span id="pgCount">–</span></span>
    <span id="stTool"></span>
    <span id="stInfo"></span>
    <span class="sp"></span>
    <span id="stDirty" class="warn"></span>
    <span id="stZoom"></span>
  </footer>
</div>

<div class="backstage" id="backstage">
  <nav class="bs-nav">
    <button class="back" data-cmd="closeBackstage"><span data-icon="CornerLeftUp" data-icon-size="17"></span>Retour</button>
    <hr>
    <button data-cmd="open"><span data-icon="FolderOpen" data-icon-size="17"></span>Ouvrir…</button>
    <button data-cmd="openFolder"><span data-icon="Folder" data-icon-size="17"></span>Ouvrir un dossier…</button>
    <button data-cmd="newDoc"><span data-icon="FilePlus2" data-icon-size="17"></span>Nouveau document</button>
    <button data-cmd="combine"><span data-icon="Merge" data-icon-size="17"></span>Combiner des fichiers…</button>
    <hr>
    <button data-cmd="save" data-needdoc><span data-icon="Save" data-icon-size="17"></span>Enregistrer</button>
    <button data-cmd="saveAs" data-needdoc><span data-icon="FileDown" data-icon-size="17"></span>Enregistrer sous…</button>
    <button data-cmd="docProps" data-needdoc><span data-icon="Info" data-icon-size="17"></span>Propriétés du document</button>
    <button data-cmd="closeDoc" data-needdoc><span data-icon="X" data-icon-size="17"></span>Fermer le document</button>
    <hr>
    <button data-cmd="install" id="bsInstall" hidden><span data-icon="MonitorDown" data-icon-size="17"></span>Installer sur l'ordinateur</button>
    <button data-cmd="help"><span data-icon="CircleHelp" data-icon-size="17"></span>Aide et notes de version</button>
  </nav>
  <div class="bs-main">
    <h2>Fichiers récents</h2>
    <div class="rlist" id="bsRecent"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<input type="file" id="fileFallback" accept="application/pdf,.pdf" multiple hidden>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => structuredClone(o);
const stripExt = n => n.replace(/\.[^.]+$/, '');
const extOf = n => (n.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
const IMG_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'];
const isPdfName = n => extOf(n) === 'pdf';
const isImgName = n => IMG_EXT.includes(extOf(n));
const fmtSize = b => b < 1024 ? b + ' o' : b < 1048576 ? (b / 1024).toFixed(0) + ' Ko' : (b / 1048576).toFixed(1) + ' Mo';

/* parse "1-3,5,8-" → index 0-based ; "" ou "toutes" = tout */
function parseRanges(str, count) {
  const s = (str || '').trim().toLowerCase();
  if (!s || s === 'toutes' || s === 'tout' || s === '*') return [...Array(count).keys()];
  if (s === 'impaires') return [...Array(count).keys()].filter(i => i % 2 === 0);
  if (s === 'paires') return [...Array(count).keys()].filter(i => i % 2 === 1);
  const out = [];
  for (const part of s.split(/[,;]/)) {
    const p = part.trim(); if (!p) continue;
    const m = p.match(/^(\d*)\s*-\s*(\d*)$/);
    if (m) {
      const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : count;
      if (a < 1 || b > count || a > b) return null;
      for (let i = a; i <= b; i++) out.push(i - 1);
    } else if (/^\d+$/.test(p)) {
      const n = +p; if (n < 1 || n > count) return null; out.push(n - 1);
    } else return null;
  }
  return out;
}

/* ---------- IndexedDB (fichiers récents, dossier mémorisé) ---------- */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('prele-pdf', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const st = t.objectStore('kv'); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return {
    get: k => tx('readonly', st => st.get(k)).catch(() => undefined),
    set: (k, v) => tx('readwrite', st => st.put(v, k)).catch(() => undefined),
  };
})();

async function addRecent(name, handle) {
  if (!handle) return;
  let list = (await idb.get('recent')) || [];
  const keep = [];
  for (const r of list) { try { if (r.name !== name || !(await r.handle.isSameEntry(handle))) keep.push(r); } catch { keep.push(r); } }
  keep.unshift({ name, handle, ts: Date.now() });
  await idb.set('recent', keep.slice(0, 15));
}
async function verifyPerm(handle, write = false) {
  const opts = { mode: write ? 'readwrite' : 'read' };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  } catch { return false; }
}

/* ---------- notifications / état occupé ---------- */
function toast(msg, kind = '', ms = 3800) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
let busyCount = 0;
function busy(on) { busyCount += on ? 1 : -1; document.body.classList.toggle('busy', busyCount > 0); }
function handleErr(e, ctx) {
  console.error(e);
  const m = String(e && (e.message || e));
  if (/encrypt/i.test(m)) toast('Ce document est protégé et n\'a pas pu être déverrouillé automatiquement.', 'err', 6000);
  else if (e && e.name === 'AbortError') { /* annulé par l'utilisateur */ }
  else toast((ctx ? ctx + ' : ' : '') + m, 'err', 6000);
}

/* =====================================================================
   Chargement des documents
   ===================================================================== */
function askPassword(name, again) {
  return new Promise(res => {
    const d = dialog({
      title: 'Document protégé', icon: 'Info', width: 420,
      body: `<p style="margin-top:0">${again ? '<b style="color:var(--danger)">Mot de passe incorrect.</b> ' : ''}« ${esc(name)} » est protégé par un mot de passe.</p>
        <div class="field"><label>Mot de passe</label><input type="text" id="pw" autocomplete="off" style="-webkit-text-security:disc"></div>`,
      buttons: [{ label: 'Annuler', value: null }, { label: 'Ouvrir', value: 'ok', primary: true }],
      onClose: v => res(v === 'ok' ? d.el.querySelector('#pw').value : null),
    });
    setTimeout(() => d.el.querySelector('#pw').focus(), 50);
    d.el.querySelector('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') d.close('ok'); });
  });
}

async function loadPdfJs(doc) {
  doc.gen = (doc.gen || 0) + 1;   // invalide les rendus en cours de l'ancienne version
  const old = doc.pdf; doc.pageObjs = [];
  if (old) { try { await old.destroy(); } catch { } }
  const task = pdfjsLib.getDocument({ data: doc.bytes.slice(), password: doc.password || undefined, isEvalSupported: false });
  let tries = 0;
  task.onPassword = async (cb, reason) => {
    const pw = await askPassword(doc.name, reason === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD || tries++ > 0);
    if (pw == null) { task.destroy(); return; }
    doc.password = pw; cb(pw);
  };
  doc.pdf = await task.promise;
  doc.pageObjs = []; doc.sizes = []; doc.text = []; doc.vps = [];
  for (let i = 1; i <= doc.pdf.numPages; i++) {
    const p = await doc.pdf.getPage(i);
    doc.pageObjs.push(p);
    const vp = p.getViewport({ scale: 1 });
    doc.sizes.push({ w: vp.width, h: vp.height });
  }
}

async function openBytes(name, bytes, handle = null, opts = {}) {
  busy(true);
  try {
    const doc = { id: uid(), name, handle, bytes, pages: [], dirty: !!opts.dirty, undo: [], redo: [], zoomMode: 'width', scale: 1, selected: new Set(), current: 0, scrollTop: 0 };
    // PDF protégé sans mot de passe d'ouverture : déverrouillage automatique
    let unlocked = false;
    try { const out = await unlockIfNeeded(doc.bytes, ''); if (out) { doc.bytes = out; unlocked = true; } }
    catch (e) { console.warn('déverrouillage sans mot de passe impossible', e); }
    await loadPdfJs(doc);
    if (!unlocked && doc.password) {
      try { const out = await unlockIfNeeded(doc.bytes, doc.password); if (out) { doc.bytes = out; doc.password = null; await loadPdfJs(doc); unlocked = true; } }
      catch (e) { console.warn('déverrouillage impossible', e); }
    }
    doc.unlocked = unlocked;
    if (unlocked) toast(`« ${name} » était protégé : la protection a été retirée, il est modifiable. Enregistrez-le pour garder cette version.`, '', 6500);
    doc.pages = doc.sizes.map(() => ({ uid: uid(), edits: [] }));
    S.docs.push(doc);
    activate(doc);
    if (handle) addRecent(name, handle);
    return doc;
  } catch (e) {
    if (e && e.name === 'PasswordException') toast('Ouverture annulée.');
    else handleErr(e, 'Impossible d\'ouvrir « ' + name + ' »');
  } finally { busy(false); }
}

async function openHandles(handles) {
  for (const h of handles) {
    try {
      if (h.kind === 'directory') { await setFolderRoot(h); continue; }
      const f = await h.getFile();
      if (isImgName(f.name)) { await openImagesAsDoc([{ name: f.name, getBytes: async () => new Uint8Array(await f.arrayBuffer()) }]); continue; }
      if (!isPdfName(f.name) && f.type !== 'application/pdf') { toast('« ' + f.name + ' » n\'est pas un PDF.', 'err'); continue; }
      const existing = await findOpenDoc(h);
      if (existing) { activate(existing); continue; }
      await openBytes(f.name, new Uint8Array(await f.arrayBuffer()), h);
    } catch (e) { handleErr(e); }
  }
}
async function findOpenDoc(h) {
  for (const d of S.docs) if (d.handle) { try { if (await d.handle.isSameEntry(h)) return d; } catch { } }
  return null;
}
async function openFiles(files) {
  for (const f of files) {
    if (isImgName(f.name)) { await openImagesAsDoc([{ name: f.name, getBytes: async () => new Uint8Array(await f.arrayBuffer()) }]); continue; }
    await openBytes(f.name, new Uint8Array(await f.arrayBuffer()), null);
  }
}
async function openImagesAsDoc(items) {
  const bytes = await combineEngine(items.map(it => ({ ...it, kind: 'image', range: '' })), { bookmarks: false, blank: 'never' });
  await openBytes(stripExt(items[0].name) + '.pdf', bytes, null, { dirty: true });
}

async function cmdOpen() {
  if (!hasFS) { $('#fileFallback').click(); return; }
  try {

/* =====================================================================
   Visionneuse
   ===================================================================== */
let pageObserver = null;

function computeScale(doc) {
  const v = viewer();
  const maxW = Math.max(...doc.sizes.map(s => s.w));
  if (doc.zoomMode === 'width') return Math.max(0.2, Math.min(5, (v.clientWidth - 46) / maxW));
  if (doc.zoomMode === 'page') {
    const s = doc.sizes[doc.current] || doc.sizes[0];
    return Math.max(0.2, Math.min(5, Math.min((v.clientWidth - 46) / s.w, (v.clientHeight - 36) / s.h)));
  }
  return doc.scale;
}

function welcomeHTML() {

}

function buildViewer() {
  const v = viewer();
  if (pageObserver) pageObserver.disconnect();
  v.innerHTML = '';
  const doc = S.active;
  if (!doc) { v.innerHTML = welcomeHTML(); renderRecentList($('#welcomeRecent')); return; }
  doc.scale = computeScale(doc);
  doc.renderGen = (doc.renderGen || 0) + 1;
  const wrap = document.createElement('div');
  wrap.className = 'pages';
  doc.sizes.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'page';
    el.dataset.index = i;
    el.dataset.pdfgen = doc.gen;
    el.style.width = Math.floor(s.w * doc.scale) + 'px';
    el.style.height = Math.floor(s.h * doc.scale) + 'px';
    el.innerHTML = `<div class="textLayer"></div><div class="layer hl"></div><div class="layer hits"></div><div class="layer edits"></div><span class="pnum">${i + 1}</span>`;
    wrap.appendChild(el);
  });
  v.appendChild(wrap);
  pageObserver = new IntersectionObserver(entries => {
    for (const en of entries) if (en.isIntersecting) renderPage(doc, +en.target.dataset.index);
  }, { root: v, rootMargin: '700px 0px' });
  $$('.page', wrap).forEach(el => pageObserver.observe(el));
  requestAnimationFrame(() => {
    if (doc.restoreScroll != null) { v.scrollTop = doc.restoreScroll; doc.restoreScroll = null; }
    else if (doc.scrollTop) v.scrollTop = doc.scrollTop;
  });
  updateUI();
}

function pageEl(i) { return viewer().querySelector(`.page[data-index="${i}"]`); }

async function renderPage(doc, i) {
  const el = pageEl(i);
  if (!el || doc !== S.active || el.dataset.pdfgen != doc.gen) return;
  const gen = doc.renderGen;
  if (el.dataset.gen == gen) return;
  el.dataset.gen = gen;
  const page = doc.pageObjs[i];
  const vp = page.getViewport({ scale: doc.scale });
  doc.vps[i] = vp;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const canvas = document.createElement('canvas');
  canvas.className = 'pc';
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  try {
    await page.render({ canvasContext: canvas.getContext('2d', { willReadFrequently: true }), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  } catch (e) { if (e && e.name !== 'RenderingCancelledException') console.warn(e); return; }
  if (doc.renderGen !== gen || doc !== S.active) return;
  el.querySelector('canvas.pc')?.remove();
  el.prepend(canvas);
  el._dpr = dpr;
  // couche texte (sélection / copie)
  try {
    const tc = await getText(doc, i);
    if (doc.renderGen !== gen) return;
    const tl = el.querySelector('.textLayer');
    tl.innerHTML = '';
    tl.style.setProperty('--scale-factor', vp.scale);
    await pdfjsLib.renderTextLayer({ textContentSource: tc.raw, container: tl, viewport: vp }).promise;
  } catch (e) { console.warn('textlayer', e); }
  renderOverlays(doc, i);
}

function renderOverlays(doc, i) {
  renderHits(doc, i);
  renderEdits(doc, i);
  renderSearchHL(doc, i);
}

function rerenderAll(keepPos = true) {
  const doc = S.active; if (!doc) return;
  const v = viewer();
  const ratio = v.scrollHeight ? v.scrollTop / v.scrollHeight : 0;
  buildViewer();
  if (keepPos) requestAnimationFrame(() => { v.scrollTop = ratio * v.scrollHeight; });
}

/* ---------- zoom ---------- */
function setZoom(mode, value) {
  const doc = S.active; if (!doc) return;
  finishEditor(true);
  const v = viewer();
  const cur = doc.current;
  if (mode === 'custom') { doc.zoomMode = 'custom'; doc.scale = Math.max(0.1, Math.min(6, value)); }
  else doc.zoomMode = mode;
  buildViewer();
  requestAnimationFrame(() => scrollToPage(cur, false));
}
function zoomStep(dir) {
  const doc = S.active; if (!doc) return;
  const s = doc.scale;
  const next = dir > 0 ? ZOOMS.find(z => z > s + 0.001) : [...ZOOMS].reverse().find(z => z < s - 0.001);
  if (next) setZoom('custom', next);
}

/* ---------- navigation ---------- */
function scrollToPage(i, smooth = true, offsetY = 0) {
  const el = pageEl(i); if (!el) return;
  viewer().scrollTo({ top: el.offsetTop - 12 + offsetY, behavior: smooth ? 'smooth' : 'auto' });

function updateCurrentPage() {

  }

/* =====================================================================
   Texte des pages (lignes éditables)
   ===================================================================== */
async function getText(doc, i) {
  if (doc.text[i]) return doc.text[i];
  const page = doc.pageObjs[i];
  const raw = await page.getTextContent();
  const lines = buildLines(raw);
  doc.text[i] = { raw, lines };
  return doc.text[i];
}

function buildLines(raw) {
  const items = raw.items.map((it, idx) => ({ it, idx })).filter(({ it }) => {
    if (!it.str || !it.transform) return false;
    const t = it.transform;
    return Math.abs(t[1]) < 1e-3 && Math.abs(t[2]) < 1e-3 && t[0] > 0 && t[3] > 0;
  });
  const lines = [];
  for (const { it, idx } of items) {
    const t = it.transform, x = t[4], y = t[5], size = t[3], w = it.width;
    const st = raw.styles[it.fontName] || {};
    let L = null;
    for (let k = lines.length - 1; k >= Math.max(0, lines.length - 6); k--) {
      const c = lines[k];
      if (c.fontName === it.fontName && Math.abs(c.y - y) < size * 0.15 && Math.abs(c.size - size) < 0.6 && x >= c.x2 - size * 0.4 && x - c.x2 < size * 1.2) { L = c; break; }
    }
    if (!it.str.trim()) { if (L && !/\s$/.test(L.text)) L.pendingSpace = true; continue; }
    if (L) {
      const gap = x - L.x2;
      if ((L.pendingSpace || gap > size * 0.12) && !/\s$/.test(L.text) && !/^\s/.test(it.str)) L.text += ' ';
      L.pendingSpace = false;
      L.text += it.str; L.x2 = Math.max(L.x2, x + w); L.items.push(idx);
    } else {
      lines.push({ key: '', order: idx, fontName: it.fontName, x, y, x2: x + w, size, hscale: t[0] / t[3], text: it.str, items: [idx], ascent: st.ascent || 0.88, descent: st.descent || -0.22, fontFamily: st.fontFamily || 'sans-serif' });
    }
  }
  for (const L of lines) {
    L.text = L.text.replace(/\s+$/, '').replace(/^\s+/, m => { return m; });
    L.key = `${Math.round(L.x * 10)}:${Math.round(L.y * 10)}:${L.order}`;
  }
  return lines.filter(L => L.text.trim()).sort((a, b) => a.order - b.order);
}

/* conversions de coordonnées PDF ↔ écran */
function rectToVp(vp, x, y, w, h) {
  const a = vp.convertToViewportPoint(x, y), b = vp.convertToViewportPoint(x + w, y + h);
  return { left: Math.min(a[0], b[0]), top: Math.min(a[1], b[1]), width: Math.abs(a[0] - b[0]), height: Math.abs(a[1] - b[1]) };
}
function lineBox(L) {
  const asc = Math.min(1.05, Math.max(0.6, L.ascent)), desc = Math.min(0.4, Math.max(0.12, -L.descent));
  return { x: L.x - 0.5, y: L.y - desc * L.size, w: (L.x2 - L.x) + 1, h: (asc + desc) * L.size };
}

function renderHits(doc, i) {
  const el = pageEl(i); if (!el) return;
  const layer = el.querySelector('.hits');
  layer.innerHTML = '';
  if (S.tool !== 'edittext' || !doc.text[i] || !doc.vps[i]) return;
  const vp = doc.vps[i];
  const edited = new Set(doc.pages[i].edits.filter(e => e.lineKey).map(e => e.lineKey));
  const frag = document.createDocumentFragment();
  doc.text[i].lines.forEach((L, li) => {
    if (edited.has(L.key)) return;
    const b = lineBox(L), r = rectToVp(vp, b.x, b.y, b.w, b.h);
    const h = document.createElement('div');
    h.className = 'hit';
    h.dataset.line = li;
    Object.assign(h.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    h.title = 'Cliquer pour modifier';
    frag.appendChild(h);
  });
  layer.appendChild(frag);
}

/* =====================================================================
   Miniatures
   ===================================================================== */
let thumbObserver = null;
function buildThumbs() {
  const box = $('#thumbs');
  if (thumbObserver) thumbObserver.disconnect();
  const doc = S.active;
  if (!doc) { box.innerHTML = '<div class="sideempty">Aucun document ouvert.</div>'; return; }
  const TW = 128;
  box.innerHTML = doc.sizes.map((s, i) => {
    const r = s.w / s.h, w = r >= 1 ? TW : Math.round(TW * r * 1.0), h = r >= 1 ? Math.round(TW / r) : TW;
    const ww = Math.min(w, TW), hh = Math.round(ww / r);
    return `<div class="thumb ${doc.selected.has(i) ? 'sel' : ''} ${i === doc.current ? 'cur' : ''}" data-index="${i}" data-pdfgen="${doc.gen}">
      <div class="tph" style="width:${ww}px;height:${hh}px"></div>${doc.pages[i].edits.length ? '<span class="tedit" title="Page modifiée"></span>' : ''}<span class="tn">${i + 1}</span></div>`;
  }).join('');
  thumbObserver = new IntersectionObserver(ens => {
    for (const en of ens) if (en.isIntersecting) { renderThumb(doc, +en.target.dataset.index, en.target); thumbObserver.unobserve(en.target); }
  }, { root: $('.sidebody'), rootMargin: '300px 0px' });
  $$('.thumb', box).forEach(t => thumbObserver.observe(t));
}
async function renderThumb(doc, i, el) {
  const ph = el.querySelector('.tph'); if (!ph || el.dataset.pdfgen != doc.gen) return;
  const w = parseFloat(ph.style.width), h = parseFloat(ph.style.height);
  const page = doc.pageObjs[i]; if (!page) return;
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: w / base.width });
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
  c.style.width = w + 'px'; c.style.height = h + 'px';
  try { await page.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise; } catch { return; }
  if (doc !== S.active || !ph.isConnected) return;
  ph.replaceWith(c);
}
function refreshThumbSel() {
  const doc = S.active; if (!doc) return;
  $$('.thumb', $('#thumbs')).forEach(t => t.classList.toggle('sel', doc.selected.has(+t.dataset.index)));
  updateUI();

/* pages ciblées : sélection, sinon page courante */
function targetPages(doc) {

async function loadFolder() {

  for (const e of entries) if (!e.dir) {
    try { const f = await e.h.getFile(); e.size = f.size; e.mtime = f.lastModified; const sub = fv.querySelector(`.frow[data-name="${CSS.escape(e.name)}"] .fsub`); if (sub) sub.textContent = `${fmtSize(f.size)} · ${fmtDate(f.lastModified)}`; } catch { }

    <div class="factions">

/* Opère sur une copie pdf-lib : fn(pdfDoc, pages) → nouveau tableau pages (ou rien) */
async function mutate(doc, fn, opts = {}) {
  finishEditor(true);
  busy(true);
  try {
    const snap = snapshot(doc);
    const pdfDoc = await PDFDocument.load(doc.bytes, { updateMetadata: false });
    let pages = clone(doc.pages);
    const res = await fn(pdfDoc, pages);
    if (res === false) return false;
    if (Array.isArray(res)) pages = res;
    const out = await pdfDoc.save();
    pushUndo(doc, snap);
    doc.bytes = out;
    doc.pages = pages;
    doc.restoreScroll = viewer().scrollTop;
    await loadPdfJs(doc);
    doc.selected = new Set(opts.select || []);
    if (opts.current != null) doc.current = opts.current;
    doc.current = Math.max(0, Math.min(doc.current, doc.sizes.length - 1));
    if (S.active === doc) { buildViewer(); buildThumbs(); if (opts.current != null) requestAnimationFrame(() => scrollToPage(doc.current, false)); }
    if (S.search.q) runSearch(S.search.q, false);
    updateUI();
    return true;
  } catch (e) { handleErr(e); return false; }
  finally { busy(false); }
}

      if (doc.pages[i].edits.length) continue;
      const tc = await getText(doc, i);
      if (tc.raw.items.some(it => it.str && it.str.trim())) continue;
      const p = doc.pageObjs[i];
      const vp = p.getViewport({ scale: 120 / doc.sizes[i].w });
      const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      const ctx = c.getContext('2d', { willReadFrequently: true });

      const d = ctx.getImageData(0, 0, c.width, c.height).data;

/* =====================================================================
   Enregistrement
   ===================================================================== */
async function applyEdits(pdfDoc, pages, doc) {
  const cache = {};
  const fontFor = async (fam, b, it) => {
    const key = fam + (b ? 'B' : '') + (it ? 'I' : '');
    if (cache[key]) return cache[key];
    const map = {
      Helvetica: [StandardFonts.Helvetica, StandardFonts.HelveticaBold, StandardFonts.HelveticaOblique, StandardFonts.HelveticaBoldOblique],
      Times: [StandardFonts.TimesRoman, StandardFonts.TimesRomanBold, StandardFonts.TimesRomanItalic, StandardFonts.TimesRomanBoldItalic],
      Courier: [StandardFonts.Courier, StandardFonts.CourierBold, StandardFonts.CourierOblique, StandardFonts.CourierBoldOblique],
    }[fam] || [StandardFonts.Helvetica, StandardFonts.HelveticaBold, StandardFonts.HelveticaOblique, StandardFonts.HelveticaBoldOblique];
    const f = await pdfDoc.embedFont(map[(b ? 1 : 0) + (it ? 2 : 0)]);
    cache[key] = { f, set: new Set(f.getCharacterSet()) };
    return cache[key];
  };
  const objs = pdfDoc.getPages();
  for (let i = 0; i < pages.length; i++) {
    const page = objs[i];
    // 1) suppression réelle du texte d'origine (lignes remplacées, zones masquées)
    const removed = new Set();
    const rects = pages[i].edits.filter(e => e.cover && (e.type === 'replace' || e.type === 'cover')).map(e => ({ key: e.id, ...e.cover }));
    if (rects.length && doc && doc.pageObjs && doc.pageObjs[i]) {
      try {
        const counts = await removeTextInRects(pdfDoc, i, doc.pageObjs[i], rects);
        if (counts) for (const e of pages[i].edits) {
          if (e.type !== 'replace') continue;
          const expected = (e.orig || '').replace(/\s/g, '').length;
          if (expected && counts[e.id] >= expected) removed.add(e.id);
        }
      } catch (err) { console.warn('suppression du texte impossible, masque conservé', err); }
    }
    // 2) masques et nouveaux textes
    for (const e of pages[i].edits) {
      if (e.cover && !removed.has(e.id)) page.drawRectangle({ x: e.cover.x, y: e.cover.y, width: e.cover.w, height: e.cover.h, color: rgb(...e.bg), borderWidth: 0 });
      if (e.text && e.type !== 'cover') {
        const { f, set } = await fontFor(e.family, e.bold, e.italic);
        const lines = e.text.replace(/\t/g, '    ').split('\n');
        lines.forEach((ln, k) => {
          const safe = [...ln].map(ch => set.has(ch.codePointAt(0)) ? ch : (ch === ' ' ? ' ' : '?')).join('');
          if (!safe) return;
          const x = e.align === 'right' && e.x2 != null ? e.x2 - f.widthOfTextAtSize(safe, e.size) : e.x;
          page.drawText(safe, { x, y: e.y - k * e.size * 1.2, size: e.size, font: f, color: rgb(...e.color) });
        });
      }
    }
  }
}

function detectFont(doc, i, L) {
  let name = '', bold = false, italic = false, fam = 'Helvetica';
  try {
    const objs = doc.pageObjs[i].commonObjs;
    if (objs.has(L.fontName)) {

function sampleColors(doc, i, box) {
  const el = pageEl(i); const c = el && el.querySelector('canvas.pc'); const vp = doc.vps[i];
  if (!c || !vp) return { bg: [1, 1, 1], fg: [0, 0, 0] };
  const r = rectToVp(vp, box.x, box.y, box.w, box.h);
  const dpr = el._dpr || 1;
  const x0 = Math.max(0, Math.floor((r.left - 2) * dpr)), y0 = Math.max(0, Math.floor((r.top - 2) * dpr));

  const w = x1 - x0 + 1, h = y1 - y0 + 1;

  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(x0, y0, w, h).data;
  const px = (x, y) => { const k = (y * w + x) * 4; return [d[k], d[k + 1], d[k + 2]]; };
  const counts = new Map();
  const add = p => { const key = p.map(v => v >> 3).join(','); const e = counts.get(key); if (e) { e.n++; e.s[0] += p[0]; e.s[1] += p[1]; e.s[2] += p[2]; } else counts.set(key, { n: 1, s: [...p] }); };
  for (let x = 0; x < w; x++) { add(px(x, 0)); add(px(x, h - 1)); }
  for (let y = 0; y < h; y++) { add(px(0, y)); add(px(w - 1, y)); }

}

function onEditBoxDown(ev, doc, i, e) {

  ev.stopPropagation(); ev.preventDefault();
  const btn = ev.target.closest('button');
  if (btn && btn.classList.contains('del')) { deleteEdit(doc, i, e); return; }
  if (btn && btn.classList.contains('mv')) { startMoveEdit(ev, doc, i, e); return; }
  if (S.editing && S.editing.edit.id === e.id) return;

}

}
function startMoveEdit(ev, doc, i, e) {
  finishEditor(true);

  const snap = snapshot(doc);

  const p0 = vp.convertToPdfPoint(ev.clientX - rect.left, ev.clientY - rect.top);
  const orig = { x: e.x, y: e.y, cx: e.cover && e.cover.x, cy: e.cover && e.cover.y };
  let moved = false;
  const mm = m => {
    const p = vp.convertToPdfPoint(m.clientX - rect.left, m.clientY - rect.top);
    const dx = p[0] - p0[0], dy = p[1] - p0[1];
    if (Math.abs(dx) + Math.abs(dy) > 0.5) moved = true;
    const live = doc.pages[i].edits.find(x => x.id === e.id); if (!live) return;
    if (live.x != null) { live.x = orig.x + dx; live.y = orig.y + dy; }

/* --- éditeur en place --- */

  S.activeEdit = e;
  renderEdits(doc, i); renderHits(doc, i);

}
function editorTextEl() {
  const E = S.editing; if (!E) return null;
  const el = pageEl(E.i); if (!el) return null;

}
function focusEditorText(selectAll) {

function finishEditor(commit) {
  const E = S.editing; if (!E) return;
  const { doc, i, edit } = E;
  const t = editorTextEl();
  if (t) edit.text = t.innerText.replace(/\n$/, '');
  S.editing = null;
  const list = doc.pages[i].edits;
  if (!commit) {
    doc.pages[i].edits = clone(E.snap.pages[i].edits);
    S.activeEdit = null;
  } else {
    const unchanged = JSON.stringify(E.before) === JSON.stringify(edit);
    const emptyAdd = edit.type === 'add' && !edit.text.trim();
    const noopReplace = edit.type === 'replace' && E.isNew && edit.text === edit.orig && !edit.styleChanged;

/* =====================================================================
   Suppression réelle du texte d'origine dans le flux de contenu
   ---------------------------------------------------------------------
   Pour chaque page, on relit le flux de contenu, on rejoue l'état
   graphique et textuel (matrices, police, espacements) en s'appuyant sur
   les largeurs de glyphes calculées par pdf.js, puis on retire les glyphes
   situés dans les zones remplacées. Chaque glyphe retiré est remplacé par
   un décalage équivalent dans un tableau TJ : le reste de la ligne ne
   bouge pas. En cas de doute (page atypique), on ne touche à rien et le
   masque de couleur joue son rôle habituel.
   ===================================================================== */
const CS_WS = new Uint8Array(256); [0, 9, 10, 12, 13, 32].forEach(c => CS_WS[c] = 1);

function parseContentStream(bytes, onOp) {

    while (p < n) {
      const c = bytes[p];

      else break;
    }
  };
  const readLit = () => {
    p++; let depth = 1; const out = [];
    while (p < n) {
      let c = bytes[p++];
      if (c === 92) {
        c = bytes[p++];
        if (c === 110) out.push(10); else if (c === 114) out.push(13); else if (c === 116) out.push(9);
        else if (c === 98) out.push(8); else if (c === 102) out.push(12);
        else if (c === 13) { if (bytes[p] === 10) p++; }
        else if (c === 10) { }
        else if (c >= 48 && c <= 55) { let v = c - 48; for (let k = 0; k < 2 && bytes[p] >= 48 && bytes[p] <= 55; k++) v = v * 8 + (bytes[p++] - 48); out.push(v & 255); }
        else out.push(c);
      } else if (c === 40) { depth++; out.push(c); }
      else if (c === 41) { if (--depth === 0) break; out.push(c); }
      else out.push(c);
    }
    return { t: 'str', b: Uint8Array.from(out) };
  };
  const readHex = () => {
    p++; let hex = '';
    while (p < n && bytes[p] !== 62) { const c = bytes[p++]; if (!CS_WS[c]) hex += String.fromCharCode(c); }
    p++;
    if (hex.length % 2) hex += '0';
    const out = new Uint8Array(hex.length / 2);
    for (let k = 0; k < out.length; k++) out[k] = parseInt(hex.substr(k * 2, 2), 16) || 0;
    return { t: 'str', b: out };
  };
  const readToken = () => { const s = p; while (p < n && !CS_WS[bytes[p]] && !CS_DL[bytes[p]]) p++; return latin1(bytes.subarray(s, p)); };
  function readObj() {
    skipWS(); if (p >= n) return null;
    const c = bytes[p];
    if (c === 40) return readLit();
    if (c === 60) {
      if (bytes[p + 1] === 60) {
        p += 2; const d = {};
        while (true) { skipWS(); if (p >= n) break; if (bytes[p] === 62 && bytes[p + 1] === 62) { p += 2; break; } const k = readObj(); if (!k) break; if (k.op != null) continue; const v = readObj(); if (k.t === 'name') d[k.v] = v; }
        return { t: 'dict', v: d };
      }
      return readHex();
    }
    if (c === 91) {
      p++; const arr = [];
      while (true) { skipWS(); if (p >= n) break; if (bytes[p] === 93) { p++; break; } const o = readObj(); if (!o) break; if (o.op == null) arr.push(o); }
      return { t: 'arr', v: arr };
    }
    if (c === 47) { p++; return { t: 'name', v: readToken() }; }
    if (c === 41 || c === 62 || c === 93 || c === 123 || c === 125) { p++; return { t: 'junk' }; }
    const s = p; const tok = readToken();

    if (tok === 'null') return { t: 'null' };

    skipWS(); if (p >= n) break;
    const s = p;
    const o = readObj(); if (!o) break;
    if (o.op == null) { o.s = s; stack.push(o); continue; }
    if (o.op === 'BI') {
      // image en ligne : on saute jusqu'à EI
      while (true) { const k = readObj(); if (!k || k.op === 'ID') break; }
      p++;
      while (p < n - 1) {
        if (bytes[p] === 69 && bytes[p + 1] === 73 && CS_WS[bytes[p - 1]] && (p + 2 >= n || CS_WS[bytes[p + 2]] || CS_DL[bytes[p + 2]])) { p += 2; break; }
        p++;
      }
      stack = []; continue;
    }
    onOp(o.op, stack, stack.length ? stack[0].s : o.start, p);
    stack = [];
  }
}

const mmul = (a, b) => [a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3], a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3], a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5]];

function pdfNameStr(o) { if (!o) return ''; const s = o.toString(); return s.startsWith('/') ? s.slice(1) : s; }
function fontInfoFor(page, resName, cache) {
  if (cache[resName]) return cache[resName];
  let info = { bpc: 1, ok: false };
  try {
    const res = page.node.Resources();
    const fonts = res && res.lookup(PDFName.of('Font'));
    const fd = fonts && fonts.lookup(PDFName.of(resName));
    if (fd) {
      const sub = pdfNameStr(fd.lookup(PDFName.of('Subtype')));
      if (sub === 'Type3') info = { bpc: 1, ok: false };
      else if (sub === 'Type0') {

async function decodedPageContent(page) {
  const contents = page.node.Contents();
  if (!contents) return null;
  const streams = [];
  const ctx = page.doc.context;
  const push = obj => { const s = obj instanceof PDFLib.PDFRef ? ctx.lookup(obj) : obj; if (s) streams.push(s); };
  if (contents instanceof PDFLib.PDFArray) { for (let k = 0; k < contents.size(); k++) push(contents.get(k)); }
  else push(contents);
  const parts = [];
  for (const s of streams) {
    if (s instanceof PDFLib.PDFRawStream) parts.push(PDFLib.decodePDFRawStream(s).decode());
    else if (s.getContents) parts.push(s.getContents());
    else if (s.getUnencodedContents) parts.push(s.getUnencodedContents());
    else return null;
  }
  const total = parts.reduce((a, b) => a + b.length + 1, 0);
  const out = new Uint8Array(total); let o = 0;
  for (const b of parts) { out.set(b, o); o += b.length; out[o++] = 10; }
  return out;
}

/* rects : [{key, x, y, w, h}] en espace utilisateur ; renvoie {key: nbGlyphesRetirés} ou null */
async function removeTextInRects(pdfDoc, pageIndex, pdfjsPage, rects) {
  const page = pdfDoc.getPage(pageIndex);
  const content = await decodedPageContent(page);
  if (!content) return null;
  // glyphes calculés par pdf.js, dans l'ordre des opérateurs d'affichage de texte
  const ol = await pdfjsPage.getOperatorList({ annotationMode: pdfjsLib.AnnotationMode.DISABLE });
  const OPS = pdfjsLib.OPS;
  const shows = []; let depth = 0;
  for (let k = 0; k < ol.fnArray.length; k++) {
    const fn = ol.fnArray[k];
    if (fn === OPS.paintFormXObjectBegin) depth++;
    else if (fn === OPS.paintFormXObjectEnd) depth--;
    else if (fn === OPS.showText && depth === 0) shows.push(ol.argsArray[k][0]);
  }

  const counts = {}; rects.forEach(r => counts[r.key] = 0);
  const repl = [];
  let showIdx = 0, unsafe = false;
  let gs = { ctm: [1, 0, 0, 1, 0, 0], font: null, fs: 0, Tc: 0, Tw: 0, Th: 1, TL: 0, rise: 0 };
  const gstack = [];
  let Tm = [1, 0, 0, 1, 0, 0], Tlm = [1, 0, 0, 1, 0, 0];

  function show(op, ops, start, end) {
    const glyphs = shows[showIdx++];
    if (!glyphs || !gs.font) { unsafe = true; return; }
    const fi = fontInfoFor(page, gs.font, fontCache);
    // contrôle de cohérence : nombre de glyphes attendu
    const strs = op === 'TJ' ? (ops[0] && ops[0].t === 'arr' ? ops[0].v.filter(o => o.t === 'str') : null) : [ops[ops.length - 1]].filter(o => o && o.t === 'str');

    const nBytes = strs.reduce((a, s) => a + s.b.length, 0);
    const nGlyphs = glyphs.filter(g => typeof g !== 'number').length;
    if (!fi.ok) { advanceOnly(glyphs, fi); return; }
    if (nBytes !== nGlyphs * fi.bpc) { unsafe = true; return; }

    const flags = [];

      if (typeof g === 'number') { tx -= g / 1000 * fs * Th; flags.push(null); continue; }
      const w = (g.width || 0) / 1000;

    const flushNum = () => { if (Math.abs(pend) > 1e-6) { flushHex(); parts.push(fmtNum(pend)); } pend = 0; };
    glyphs.forEach((g, k) => {
      if (typeof g === 'number') { pend += g; return; }
      const isSp = fi.bpc === 1 && g.originalCharCode === 32;
      if (flags[k]) { pend += -((g.width || 0) / 1000 * fs + gs.Tc + (isSp ? gs.Tw : 0)) * 1000 / fs; return; }
      flushNum();
      hex += g.originalCharCode.toString(16).padStart(fi.bpc * 2, '0');
    });

    if (op === "'") prefix = 'T* ';
    if (op === '"') prefix = `${fmtNum(num(ops, 0))} Tw ${fmtNum(num(ops, 1))} Tc T* `;
    repl.push({ start, end, text: `${prefix}[${parts.join(' ')}] TJ` });

    let tx = 0;

      const isSp = fi.bpc === 1 && g.originalCharCode === 32;
      tx += ((g.width || 0) / 1000 * gs.fs + gs.Tc + (isSp ? gs.Tw : 0)) * gs.Th;
    }

  parseContentStream(content, (op, ops, start, end) => {
    if (unsafe) return;

      case 'Q': if (gstack.length) gs = gstack.pop(); break;
      case 'cm': if (ops.length >= 6) gs.ctm = mmul(ops.slice(-6).map(o => o.v || 0), gs.ctm); break;
      case 'BT': Tm = [1, 0, 0, 1, 0, 0]; Tlm = [1, 0, 0, 1, 0, 0]; break;
      case 'Tf': if (ops.length >= 2 && ops[0].t === 'name') { gs.font = ops[0].v; gs.fs = num(ops, 1); } break;
      case 'Tc': gs.Tc = num(ops, 0); break;
      case 'Tw': gs.Tw = num(ops, 0); break;
      case 'Tz': gs.Th = num(ops, 0) / 100; break;
      case 'TL': gs.TL = num(ops, 0); break;
      case 'Ts': gs.rise = num(ops, 0); break;
      case 'Td': nextLine(num(ops, 0), num(ops, 1)); break;
      case 'TD': gs.TL = -num(ops, 1); nextLine(num(ops, 0), num(ops, 1)); break;
      case 'Tm': if (ops.length >= 6) { Tm = ops.slice(-6).map(o => o.v || 0); Tlm = Tm.slice(); } break;
      case 'T*': nextLine(0, -gs.TL); break;
      case 'Tj': case 'TJ': show(op, ops, start, end); break;
      case "'": nextLine(0, -gs.TL); show(op, ops, start, end); break;
      case '"': gs.Tw = num(ops, 0); gs.Tc = num(ops, 1); nextLine(0, -gs.TL); show(op, ops, start, end); break;
      case 'gs': break;
    }
  });
  if (unsafe || showIdx !== shows.length) return null;
  if (!repl.length) return counts;
  // réécriture du flux
  const enc = new TextEncoder();
  repl.sort((a, b) => a.start - b.start);
  const chunks = []; let pos = 0;
  for (const r of repl) { chunks.push(content.subarray(pos, r.start)); chunks.push(enc.encode(r.text)); pos = r.end; }
  chunks.push(content.subarray(pos));
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const out = new Uint8Array(total); let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  const ref = pdfDoc.context.register(pdfDoc.context.flateStream(out));
  page.node.set(PDFName.of('Contents'), ref);
  return counts;
}

}

   Combinaison
   ===================================================================== */
function addOutlines(pdfDoc, items) {
  if (!items.length) return;
  const ctx = pdfDoc.context;
  const pageRefs = pdfDoc.getPages().map(p => p.ref);
  const outlinesRef = ctx.nextRef();
  const refs = items.map(() => ctx.nextRef());
  items.forEach((it, k) => {
    const d = { Title: PDFHexString.fromText(it.title), Parent: outlinesRef, Dest: [pageRefs[it.pageIndex], 'Fit'] };
    if (k > 0) d.Prev = refs[k - 1];
    if (k < items.length - 1) d.Next = refs[k + 1];
    ctx.assign(refs[k], ctx.obj(d));
  });
  ctx.assign(outlinesRef, ctx.obj({ Type: 'Outlines', First: refs[0], Last: refs[refs.length - 1], Count: items.length }));
  pdfDoc.catalog.set(PDFName.of('Outlines'), outlinesRef);
  pdfDoc.catalog.set(PDFName.of('PageMode'), PDFName.of('UseOutlines'));
}

async function imageToPdfPage(out, bytes, name) {
  const ext = extOf(name);
  let img;
  if (ext === 'jpg' || ext === 'jpeg') img = await out.embedJpg(bytes);
  else if (ext === 'png') img = await out.embedPng(bytes);
  else {
    const bmp = await createImageBitmap(new Blob([bytes]));
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    img = await out.embedPng(new Uint8Array(await blob.arrayBuffer()));
  }
  const land = img.width > img.height;
  const pw = land ? 841.89 : 595.28, ph = land ? 595.28 : 841.89;
  const sc = Math.min(pw / img.width, ph / img.height);
  const page = out.addPage([pw, ph]);
  page.drawImage(img, { x: (pw - img.width * sc) / 2, y: (ph - img.height * sc) / 2, width: img.width * sc, height: img.height * sc });
}

/* entries : {name, getBytes, kind:'pdf'|'image', range} */
async function combineEngine(entries, opts = {}, progress) {
  const out = await PDFDocument.create();
  const bms = [];
  for (let k = 0; k < entries.length; k++) {
    const e = entries[k];
    progress && progress(k, entries.length, e.name);
    const start = out.getPageCount();
    const bytes = await e.getBytes();
    if (e.kind === 'image' || isImgName(e.name)) {
      await imageToPdfPage(out, bytes, e.name);
    } else {
      let src;
      src = await loadPdfLibUnlocked(bytes, e.name);
      const idx = parseRanges(e.range, src.getPageCount());
      if (!idx) throw new Error(`« ${e.name} » : plage de pages invalide (${e.range})`);
      const copied = await out.copyPages(src, idx);
      copied.forEach(p => out.addPage(p));
    }
    const added = out.getPageCount() - start;
    if (opts.bookmarks && added) bms.push({ title: stripExt(e.name), pageIndex: start });
    if (added && k < entries.length - 1 && (opts.blank === 'always' || (opts.blank === 'odd' && added % 2 === 1))) {
      const last = out.getPage(out.getPageCount() - 1);
      const { width, height } = last.getSize();
      const rot = last.getRotation().angle % 180 !== 0;
      out.addPage(rot ? [height, width] : [width, height]);
    }
  }
  progress && progress(entries.length, entries.length, '');
  if (opts.bookmarks) addOutlines(out, bms);
  if (opts.title) out.setTitle(opts.title);
  out.setProducer('Éditeur PDF ' + APP_VERSION);
  out.setCreator('Éditeur PDF');
  return await out.save();
}

async function srcBytes(src) {
  if (src.type === 'handle') { const f = await src.handle.getFile(); return new Uint8Array(await f.arrayBuffer()); }
  if (src.type === 'file') return new Uint8Array(await src.file.arrayBuffer());
  if (src.type === 'doc') return await buildOutputBytes(src.doc);
  throw new Error('source inconnue');
}
async function pageCountOf(row) {
  if (isImgName(row.name)) return 1;
  try {
    const b = await srcBytes(row.src);
    const p = await pdfjsLib.getDocument({ data: b, isEvalSupported: false }).promise;
    const n = p.numPages; p.destroy(); return n;
  } catch { return '?'; }
}

async function* walkDir(dir, recursive, path = []) {
  const list = [];
  for await (const [name, h] of dir.entries()) list.push([name, h]);
  list.sort((a, b) => collator.compare(a[0], b[0]));
  for (const [name, h] of list) {
    if (h.kind === 'file' && (isPdfName(name) || isImgName(name))) yield { name, handle: h, path: [...path, dir.name] };
  }
  if (recursive) for (const [name, h] of list) if (h.kind === 'directory' && !name.startsWith('.')) yield* walkDir(h, true, [...path, dir.name]);
}

async function dropToSources(dt) {
  const out = [];
  const items = [...(dt.items || [])].filter(i => i.kind === 'file');
  const hp = items.map(i => (i.getAsFileSystemHandle ? i.getAsFileSystemHandle() : null));
  const files = items.map(i => i.getAsFile());
  for (let k = 0; k < items.length; k++) {
    const h = hp[k] ? await hp[k].catch(() => null) : null;
    if (h && h.kind === 'directory') { for await (const f of walkDir(h, true)) out.push({ name: f.name, sub: f.path.join(' › '), src: { type: 'handle', handle: f.handle } }); continue; }
    const f = files[k]; if (!f || !(isPdfName(f.name) || isImgName(f.name))) continue;
    out.push({ name: f.name, src: h ? { type: 'handle', handle: h } : { type: 'file', file: f } });
  }
  return out;
}
